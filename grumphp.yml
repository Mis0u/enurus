grumphp:
    stop_on_failure: true
    ignore_unstaged_changes: true

    tasks:
        ecs:
            config: tools/ecs/ecs.php
            triggered_by: [ php ]

        phpstan:
            configuration: tools/phpstan/phpstan.dist.neon
            triggered_by: [ php ]

        phpmnd:
            directory: './src'
            exclude: [ 'tests' ]
            hint: true
            triggered_by: [ php ]

        twigcs:
            path: 'templates'
            severity: 'error'
            display: 'all'
            ruleset: 'FriendsOfTwig\Twigcs\Ruleset\Official'
            triggered_by: [ twig ]

        phpunit:
            config_file: 'phpunit.dist.xml'

        git_commit_message:
            allow_empty_message: false
            enforce_no_subject_trailing_period: true
            enforce_capitalized_subject: false
