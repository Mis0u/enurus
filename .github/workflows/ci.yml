name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    qa:
        runs-on: ubuntu-latest

        services:
            database:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: '!ChangeMe!'
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -d app -U app"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, gd, intl, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install Node dependencies
              run: npm ci

            - name: Create test database
              run: vendor/bin/castor create-db --test --no-interaction

            - name: Run migrations
              run: vendor/bin/castor migrate --test --no-interaction

            - name: Load fixtures
              run: vendor/bin/castor load-fixtures --test --no-interaction

            - name: PHPStan
              run: vendor/bin/castor phpstan --no-interaction

            - name: ECS
              run: vendor/bin/castor ecs --no-interaction

            - name: TwigCS
              run: vendor/bin/castor twigcs --no-interaction

            - name: PHPMND
              run: vendor/bin/castor phpmnd --no-interaction

            - name: ESLint
              run: vendor/bin/castor eslint --no-interaction

            - name: Schema validate
              run: vendor/bin/castor schema-validate --test --no-interaction

            - name: PHPUnit
              run: vendor/bin/castor test --no-interaction

            - name: Vitest
              run: vendor/bin/castor test-js --no-interaction
