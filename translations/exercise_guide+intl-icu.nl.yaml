barbell_curl_standing:
    intro: "De staande barbell curl is de basisoefening voor grotere biceps. Met een rechte stang til je zwaarder dan met dumbbells, zolang je bovenlichaam stil blijft."
    mistakes:
        1:
            text: "Met je bovenlichaam zwaaien om de stang omhoog te krijgen verlegt de inspanning naar je rug. Neem minder gewicht en houd je romp stil."
            title: "Zwaaien met het bovenlichaam"
        2:
            text: "Als je ellebogen naar voren schuiven, nemen je schouders het over. Houd ze van begin tot eind langs je lichaam."
            title: "Ellebogen schuiven naar voren"
        3:
            text: "Weer omhoog gaan voordat je armen gestrekt zijn, maakt de beweging korter. Laat zakken tot je armen gestrekt zijn, zonder de spanning te verliezen."
            title: "Onvolledig laten zakken"
    steps:
        1: "Sta met je voeten op heupbreedte en pak de stang in onderhandse greep (handpalmen naar boven), handen op schouderbreedte."
        2: "Houd je armen gestrekt, zet je ellebogen tegen je zij en span je buik aan."
        3: "Buig je ellebogen om de stang naar je schouders te brengen, zonder ellebogen of bovenlichaam te bewegen."
        4: "Span je biceps bovenaan aan en laat de stang dan langzaam zakken tot je armen gestrekt zijn."
    variants:
        dumbbell_curl_standing: "Elke arm werkt apart, handig als één kant zwakker is."
        ez_bar_curl: "De EZ-stang ontlast je polsen en ellebogen."
        preacher_curl: "Je armen rusten op het kussen, valsspelen is onmogelijk."

barbell_row:
    intro: "Barbell rows bouwen een dikke rug: brede rugspier, trapezius en achterkant van de schouders. Het is ook een uitstekende rompoefening, want je rug moet de hele set stil blijven."
    mistakes:
        1:
            text: "Een bolle rug onder belasting brengt je onderrug in gevaar. Houd je rug recht en je borst vooruit."
            title: "Bolle rug"
        2:
            text: "Bij elke herhaling rechtop komen maakt van de row een deadlift. Houd je bovenlichaam van begin tot eind in dezelfde hoek."
            title: "Bovenlichaam komt omhoog"
        3:
            text: "Trekken met je armen zonder je schouderbladen samen te knijpen traint vooral je biceps. Denk eraan je ellebogen naar achteren te brengen."
            title: "Trekken met de armen"
    steps:
        1: "Sta met je voeten op heupbreedte en pak de stang in bovenhandse greep, handen iets breder dan je schouders."
        2: "Buig je knieën licht en kantel je bovenlichaam met een rechte rug naar voren, tot ongeveer 45°."
        3: "Laat de stang met gestrekte armen onder je schouders hangen en span je buik aan."
        4: "Trek de stang naar je navel door je ellebogen naar achteren te brengen en je schouderbladen samen te knijpen."
        5: "Laat gecontroleerd zakken tot je armen gestrekt zijn, zonder je bovenlichaam te bewegen."
    variants:
        cable_row: "Constante spanning en een ondersteunde rug, ideaal om je training af te sluiten."
        dumbbell_row: "Eén arm tegelijk, met steun die je onderrug beschermt."

barbell_squat:
    intro: "De barbell squat is de koning van de beenoefeningen. Hij traint je quadriceps en bilspieren, geholpen door je hamstrings, adductoren en je hele romp."
    mistakes:
        1:
            text: "Knieën die naar binnen vallen belasten het gewricht. Duw ze in de richting van je voeten."
            title: "Knieën vallen naar binnen"
        2:
            text: "Je hielen optillen verplaatst het gewicht naar je voorvoet en je knieën. Houd je hele voet op de grond."
            title: "Hielen komen los"
        3:
            text: "Een rug die onderin bol wordt, brengt je onderrug in gevaar. Ga alleen zo diep als je stevig kunt blijven."
            title: "Rug wordt bol"
        4:
            text: "Een halve squat laat meer gewicht toe, maar traint je bilspieren minder. Ga minstens tot je dijen parallel aan de grond zijn."
            title: "Te kleine bewegingsuitslag"
    steps:
        1: "Leg de stang op je bovenrug (trapezius), handen iets breder dan je schouders, ellebogen onder de stang."
        2: "Haal de stang uit het rek, zet twee stappen achteruit en zet je voeten op schouderbreedte, tenen iets naar buiten."
        3: "Adem in, span je buik aan en zak door je heupen naar achteren te duwen, knieën in de richting van je voeten."
        4: "Zak minstens tot je dijen parallel aan de grond zijn, met een rechte rug."
        5: "Kom omhoog door met je hele voet te duwen en adem bovenaan uit."
    variants:
        barbell_front_squat: "Stang voor, bovenlichaam rechter: meer quadriceps, minder rug."
        hack_squat: "Geleid door de machine, om je benen te belasten zonder op je evenwicht te letten."
        leg_press: "Rug ondersteund, om zwaar te trainen zonder belasting op je wervelkolom."

bench_press_bar:
    intro: "Bankdrukken is dé referentieoefening voor kracht in je bovenlichaam. Het traint vooral je borst en de voorkant van je schouders, geholpen door je triceps."
    mistakes:
        1:
            text: "Met je armen op 90° van je bovenlichaam dragen je schouders alles. Houd je ellebogen op ongeveer 45°."
            title: "Ellebogen te wijd"
        2:
            text: "De stang laten stuiteren op je borst neemt werk weg van je borstspieren. Raak je borst licht aan, zonder vaart."
            title: "Stuiterende stang"
        3:
            text: "Je bekken blijft op de bank. Komt het los, dan is het gewicht te zwaar."
            title: "Billen komen los"
        4:
            text: "Halverwege stoppen laat meer gewicht toe, maar levert minder vooruitgang op. Laat de stang tot je borst zakken."
            title: "Halve beweging"
    steps:
        1: "Ga op de bank liggen met je ogen onder de stang en je voeten plat op de grond."
        2: "Pak de stang iets breder dan je schouders, knijp je schouderbladen samen en maak je bovenrug licht hol."
        3: "Haal de stang uit het rek en houd hem met gestrekte armen boven je schouders."
        4: "Laat hem gecontroleerd zakken tot hij je onderste borst raakt, ellebogen op ongeveer 45° van je bovenlichaam."
        5: "Duw de stang omhoog terwijl je uitademt, tot je armen weer gestrekt zijn."
    variants:
        bench_press_dumbbell: "Meer bewegingsuitslag, en elke arm werkt apart."
        decline_bench_press_bar: "Legt de nadruk op de onderkant van je borst."
        incline_bench_press_dumbbell: "Legt de nadruk op de bovenkant van je borst."

