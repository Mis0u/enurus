        title: "Volg je vooruitgang"

deadlift:
    intro: "De deadlift traint bijna je hele lichaam: eerst je onderrug, bilspieren en hamstrings, maar ook je quadriceps, rug en onderarmen. Bij geen enkele oefening til je zwaarder, en bij geen enkele telt de techniek meer."
    mistakes:
        1:
            text: "Tillen met een bolle rug is de gevaarlijkste fout. Lukt het niet om je rug recht te houden, dan is het gewicht te zwaar."
            title: "Bolle rug"
        2:
            text: "Een stang die van je benen wegdrijft, trekt aan je onderrug. Laat hem langs je schenen en daarna je dijen glijden."
            title: "Stang te ver van het lichaam"
        3:
            text: "Je heupen eerder laten stijgen dan je schouders maakt er een stiff-leg deadlift van. Heupen en schouders komen samen omhoog."
            title: "Heupen schieten omhoog"
        4:
            text: "Bovenaan achterover leunen drukt je onderrug samen. Eindig gewoon rechtop."
            title: "Overstrekken bovenaan"
    steps:
        1: "Sta met je voeten op heupbreedte, de stang boven het midden van je voeten."
        2: "Buig voorover door je heupen naar achteren te duwen en pak de stang net buiten je benen."
        3: "Buig je knieën tot je schenen de stang raken, borst vooruit en rug recht."
        4: "Span je buik aan en duw tegen de grond om de stang langs je benen omhoog te brengen, heupen en schouders tegelijk."
        5: "Eindig rechtop met gestrekte heupen en laat de stang langs dezelfde weg weer zakken."
    variants:
        romanian_deadlift: "Benen bijna gestrekt, voor je hamstrings en bilspieren."
        stiff_leg_deadlift: "Benen gestrekt, voor een maximale rek van de achterkant van je dijen."

dips_chest:
    intro: "Dips aan de brug met je bovenlichaam naar voren gekanteld zijn een van de beste lichaamsgewichtoefeningen voor je borst. Je triceps en de voorkant van je schouders werken mee."
    mistakes:
        1:
            text: "Te diep zakken rekt de voorkant van je schouder sterk op. Stop als je bovenarmen ongeveer parallel aan de grond zijn."
            title: "Te diep zakken"
        2:
            text: "Met een rechtop bovenlichaam werken vooral je triceps. Leun naar voren om je borst te raken."
            title: "Bovenlichaam te rechtop"
        3:
            text: "Je schouders naar je oren laten optrekken zet ze in een slechte positie. Houd ze laag en weg van je oren."
            title: "Opgetrokken schouders"
    steps:
        1: "Pak de liggers vast en druk jezelf omhoog in steun, armen gestrekt, schouders laag."
        2: "Kantel je bovenlichaam naar voren en laat je ellebogen iets naar buiten gaan."
        3: "Zak door je ellebogen te buigen tot je bovenarmen ongeveer parallel aan de grond zijn."
        4: "Duw tegen de liggers om omhoog te komen tot je armen gestrekt zijn."
    variants:
        bench_press_bar: "Om zwaar te trainen en met schijven op te bouwen."
        dips_triceps: "Bovenlichaam rechtop, voor de achterkant van je armen."
        push_up: "Makkelijker, om de duwbeweging te leren."

incline_bench_press_dumbbell:
    intro: "Schuin bankdrukken met dumbbells richt zich op je bovenste borst en de voorkant van je schouders. Dumbbells geven meer bewegingsuitslag dan een stang en laten elke arm apart werken."
    mistakes:
        1:
            text: "Boven de 45° duwen vooral je schouders. Blijf tussen 30 en 45°."
            title: "Bank te steil"
        2:
            text: "De dumbbells bovenaan tegen elkaar slaan haalt de spanning weg. Breng ze dicht bij elkaar zonder dat ze elkaar raken."
            title: "Botsende dumbbells"
        3:
            text: "De dumbbells onderaan laten vallen overbelast je schouders. Laat ze in twee tot drie seconden zakken."
            title: "Ongecontroleerd zakken"
    steps:
        1: "Zet de bank tussen 30 en 45° en ga zitten met op elke dij een dumbbell."
        2: "Ga liggen en breng de dumbbells naar borsthoogte, voeten plat op de grond."
        3: "Knijp je schouderbladen samen en houd de dumbbells met gestrekte armen boven je bovenste borst."
        4: "Laat langzaam zakken tot je de rek in je borst voelt, ellebogen iets onder je schouders."
        5: "Duw de dumbbells omhoog en breng ze daarbij iets naar elkaar toe, en herhaal."
    variants:
        bench_press_bar: "Vlakke bank en stang, om zwaarder te tillen."
        dumbbell_fly_incline: "Flyes op dezelfde bank, om je bovenste borst te isoleren."
        incline_bench_press_bar: "Met een stang, om in dezelfde hoek zwaarder te tillen."

index:
    heading: "Krachtoefeningen"
    heading_highlight: "per spier"
    intro: "De getrainde spieren, de uitvoering stap voor stap, veelgemaakte fouten en varianten van elke oefening. Kies een spier en daarna een oefening."
    meta_description: "Uitleg van krachtoefeningen per spier: getrainde spieren, uitvoering, veelgemaakte fouten en varianten."
    title: "Krachtoefeningen per spier"

leg_press:
    intro: "De beenpers traint je quadriceps en bilspieren zonder belasting op je wervelkolom. Je kunt er veilig zwaar mee duwen, als aanvulling op of in plaats van de squat."
    mistakes:
        1:
            text: "Je knieën bovenaan op slot zetten legt de hele belasting op het gewricht. Houd ze altijd licht gebogen."
            title: "Knieën op slot"
        2:
            text: "Komt je onderrug onderaan los van de rugleuning, dan zak je te diep. Stop net daarvoor."
            title: "Bekken komt los"
        3:
            text: "Knieën die naar binnen vallen belasten het gewricht. Duw ze in de richting van je voeten."
            title: "Knieën vallen naar binnen"
    steps:
        1: "Ga zitten met je rug en billen stevig tegen de rugleuning."
        2: "Zet je voeten in het midden van het platform, op heupbreedte, tenen iets naar buiten."
        3: "Duw het platform weg om het te ontgrendelen en haal de beveiligingen weg."
        4: "Zak door je knieën te buigen tot ongeveer 90°, zonder dat je bekken loskomt van de rugleuning."
        5: "Duw via je hielen omhoog, zonder je knieën bovenaan op slot te zetten."
    variants:
        barbell_squat: "De basisbeweging, die ook je evenwicht en romp traint."
        hack_squat: "Ook met ondersteunde rug, maar staand, dichter bij de squat."

military_press_bar:
    intro: "De military press is de basisoefening voor sterke schouders. Hij traint de voor- en zijkant van je schouders, geholpen door je triceps en trapezius."
    mistakes:
        1:
            text: "Achterover leunen maakt er schuin bankdrukken van en belast je onderrug. Span je billen en buik aan."
            title: "Te holle rug"
        2:
            text: "De stang voor je gezicht omhoog duwen maakt hem zwaarder en vermoeit je schouders. Hij gaat recht omhoog; je hoofd wijkt even naar achteren."
            title: "Stang te ver naar voren"
        3:
            text: "De stang op voorhoofdhoogte stoppen maakt de beweging korter. Laat hem zakken tot je bovenste borst."
            title: "Halve beweging"
    steps:
        1: "Sta met je voeten op heupbreedte en pak de stang iets breder dan je schouders."
        2: "Leg de stang op je bovenste borst, ellebogen iets voor de stang."
        3: "Span je billen en buik aan om je lichaam recht te houden."
        4: "Duw de stang recht omhoog boven je hoofd en breng je hoofd iets naar achteren om hem te laten passeren."
        5: "Eindig met gestrekte armen boven je hoofd en laat de stang gecontroleerd zakken tot je borst."
    variants:
        arnold_press: "Met dumbbells en een draaibeweging, voor een grotere bewegingsuitslag van je schouder."
        military_press_machine: "Geleid door de machine, om je op het duwen te concentreren."

pull_up:
    intro: "Pull-ups in bovenhandse greep (handpalmen van je af) zijn dé oefening voor een brede rug. Ze trainen vooral je brede rugspier, geholpen door je biceps, trapezius en de achterkant van je schouders."
    mistakes:
        1:
            text: "Met je benen zwaaien om omhoog te komen neemt werk weg van je rug. Houd je lichaam aangespannen en stil."
            title: "Zwaaien met de benen"
        2:
            text: "Stoppen voordat je kin boven de stang is, of weer trekken voordat je armen gestrekt zijn, maakt de oefening korter. Maak de volledige beweging."
            title: "Halve beweging"
        3:
            text: "Alleen met je armen trekken vermoeit je biceps eerder dan je rug. Begin elke herhaling door je schouders omlaag te trekken."
            title: "Ontspannen schouders"
    steps:
        1: "Pak de stang in bovenhandse greep, handen iets breder dan je schouders."
        2: "Hang met gestrekte armen, benen tegen elkaar en buik aangespannen."
        3: "Trek je schouders omlaag en knijp je schouderbladen samen om de beweging te starten."
        4: "Trek jezelf op door je ellebogen naar je heupen te brengen tot je kin boven de stang is."
        5: "Laat jezelf langzaam zakken tot je armen volledig gestrekt zijn."
    variants:
        chin_up: "Handpalmen naar je toe, meer biceps en vaak makkelijker."
        lat_pulldown: "Aan de machine, om het gewicht aan te passen zolang pull-ups nog te zwaar zijn."

