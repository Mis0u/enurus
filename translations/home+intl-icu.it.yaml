        languages:
            answer: "Francese, inglese, italiano, spagnolo, portoghese, tedesco, olandese e polacco."
            question: "In quali lingue?"
        mobile:
            answer: "Sì. Il sito si adatta al tuo schermo e si può installare nella schermata home, come un'app."
