barbell_curl_standing:
    intro: "A rosca direta com barra em pé é o exercício base para o volume dos bíceps. A barra reta permite carregar mais do que com halteres, desde que o tronco fique imóvel."
    mistakes:
        1:
            text: "Balançar o tronco para subir a barra passa o esforço para as costas. Baixa a carga e mantém o tronco imóvel."
            title: "Balanço do tronco"
        2:
            text: "Se os cotovelos avançam, são os ombros que trabalham. Mantém-nos junto ao corpo do início ao fim."
            title: "Cotovelos que avançam"
        3:
            text: "Voltar a subir antes de esticar os braços encurta o movimento. Desce até à extensão sem perder a tensão."
            title: "Descida incompleta"
    steps:
        1: "Em pé, pés à largura das ancas, agarra a barra em supinação (palmas para cima), mãos à largura dos ombros."
        2: "Com os braços esticados, encosta os cotovelos ao corpo e contrai os abdominais."
        3: "Dobra os cotovelos para levar a barra até aos ombros, sem mexer os cotovelos nem o tronco."
        4: "Contrai os bíceps em cima e desce devagar até esticar os braços."
    variants:
        dumbbell_curl_standing: "Cada braço trabalha sozinho, útil se um lado for mais fraco."
        ez_bar_curl: "A barra W alivia os pulsos e os cotovelos."
        preacher_curl: "Os braços apoiados no banco impedem qualquer batota."

barbell_row:
    intro: "O remo com barra constrói a espessura das costas: grande dorsal, trapézios e parte de trás dos ombros. É também um excelente exercício de core, porque as costas têm de ficar fixas durante toda a série."
    mistakes:
        1:
            text: "Costas arredondadas sob carga põem a lombar em risco. Mantém as costas direitas e o peito para fora."
            title: "Costas arredondadas"
        2:
            text: "Endireitar-te a cada repetição transforma o remo num peso morto. Mantém a mesma inclinação do tronco do início ao fim."
            title: "Tronco que se endireita"
        3:
            text: "Puxar com os braços sem juntar as omoplatas trabalha sobretudo os bíceps. Pensa em levar os cotovelos para trás."
            title: "Puxar com os braços"
    steps:
        1: "Em pé, pés à largura das ancas, agarra a barra em pronação, mãos um pouco mais afastadas do que os ombros."
        2: "Dobra ligeiramente os joelhos e inclina o tronco para a frente, costas direitas, até cerca de 45°."
        3: "Com os braços esticados, deixa a barra pendurada por baixo dos ombros e contrai os abdominais."
        4: "Puxa a barra até ao umbigo, levando os cotovelos para trás e juntando as omoplatas."
        5: "Desce de forma controlada até esticar os braços, sem mexer o tronco."
    variants:
        cable_row: "Tensão constante e costas apoiadas, ideal para terminar o treino."
        dumbbell_row: "Um braço de cada vez, com um apoio que protege a lombar."

barbell_squat:
    intro: "O agachamento com barra é o rei dos exercícios de pernas. Trabalha os quadríceps e os glúteos, com a ajuda dos isquiotibiais, dos adutores e de todo o core."
    mistakes:
        1:
            text: "Joelhos que fogem para dentro fragilizam a articulação. Empurra-os na direção dos pés."
            title: "Joelhos para dentro"
        2:
            text: "Levantar os calcanhares passa o peso para a ponta dos pés e para os joelhos. Mantém o pé inteiro no chão."
            title: "Calcanhares que levantam"
        3:
            text: "Costas que arredondam em baixo expõem a lombar. Desce só até onde consegues manter-te firme."
            title: "Costas que arredondam"
        4:
            text: "Um meio agachamento permite mais carga mas trabalha menos os glúteos. Desce pelo menos até as coxas ficarem paralelas ao chão."
            title: "Amplitude demasiado curta"
    steps:
        1: "Coloca a barra na parte de cima das costas (trapézios), mãos um pouco mais afastadas do que os ombros, cotovelos por baixo da barra."
        2: "Tira a barra do suporte, recua dois passos e afasta os pés à largura dos ombros, pontas ligeiramente para fora."
        3: "Inspira, contrai o abdómen e desce levando as ancas para trás e os joelhos na direção dos pés."
        4: "Desce pelo menos até as coxas ficarem paralelas ao chão, com as costas direitas."
        5: "Sobe empurrando com o pé inteiro e expira em cima."
    variants:
        barbell_front_squat: "Barra à frente, tronco mais direito: mais quadríceps, menos costas."
        hack_squat: "Guiado pela máquina, para carregar as pernas sem te preocupares com o equilíbrio."
        leg_press: "Costas apoiadas, para treinar pesado sem carga na coluna."

bench_press_bar:
    intro: "O supino reto é o exercício de referência para a força da parte superior do corpo. Trabalha sobretudo o peito e a parte da frente dos ombros, com a ajuda dos tríceps."
    mistakes:
        1:
            text: "Com os braços a 90° do tronco, são os ombros que aguentam tudo. Mantém os cotovelos a cerca de 45°."
            title: "Cotovelos demasiado abertos"
        2:
            text: "O ressalto no peito rouba trabalho aos peitorais. Toca levemente, sem impulso."
            title: "Barra que ressalta"
        3:
            text: "A bacia fica no banco. Se levantar, a carga é demasiado pesada."
            title: "Glúteos que levantam"
        4:
            text: "Descer só até meio permite mais carga, mas menos progresso. Leva a barra até ao peito."
            title: "Amplitude parcial"
    steps:
        1: "Deita-te no banco com os olhos por baixo da barra e os pés bem assentes no chão."
        2: "Agarra a barra um pouco mais afastada do que os ombros, junta as omoplatas e arqueia ligeiramente a parte de cima das costas."
        3: "Tira a barra do suporte e coloca-a por cima dos ombros, braços esticados."
        4: "Desce de forma controlada até tocar a parte de baixo do peito, cotovelos a cerca de 45° do tronco."
        5: "Empurra a barra para cima a expirar, até voltares a ter os braços esticados."
    variants:
        bench_press_dumbbell: "Mais amplitude, e cada braço trabalha sozinho."
        decline_bench_press_bar: "Põe a ênfase na parte de baixo do peito."
        incline_bench_press_dumbbell: "Põe a ênfase na parte de cima do peito."

