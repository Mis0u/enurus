            title: "Registra un allenamento"
        welcome:
            description: "Enurus tiene traccia dei tuoi allenamenti per farti vedere i tuoi progressi. Un giro veloce di 30 secondi?"
            title: "Benvenuto su Enurus!"
        workouts:
            description: "Lo storico di tutti i tuoi allenamenti, con un calendario della tua attività nell'anno."
            title: "Allenamenti"
