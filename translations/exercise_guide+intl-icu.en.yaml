barbell_curl_standing:
    intro: "The standing barbell curl is the basic exercise for bigger biceps. A straight bar lets you lift heavier than with dumbbells, as long as your torso stays still."
    mistakes:
        1:
            text: "Swinging your torso to lift the bar shifts the effort to your back. Lower the weight and keep your torso still."
            title: "Swinging the torso"
        2:
            text: "If your elbows drift forward, your shoulders take over. Keep them against your sides from start to finish."
            title: "Elbows moving forward"
        3:
            text: "Curling back up before your arms are straight shortens the movement. Lower all the way down without losing tension."
            title: "Partial lowering"
    steps:
        1: "Stand with feet hip-width apart and grip the bar with palms facing up, hands shoulder-width apart."
        2: "With arms straight, tuck your elbows against your sides and brace your abs."
        3: "Bend your elbows to bring the bar up towards your shoulders, without moving your elbows or torso."
        4: "Squeeze your biceps at the top, then lower slowly until your arms are straight."
    variants:
        dumbbell_curl_standing: "Each arm works on its own, useful if one side is weaker."
        ez_bar_curl: "The angled bar is easier on the wrists and elbows."
        preacher_curl: "Arms resting on the pad make cheating impossible."

barbell_row:
    intro: "The barbell row builds a thick back: lats, traps and rear shoulders. It is also a great core exercise, as your back has to stay locked in place for the whole set."
    mistakes:
        1:
            text: "A rounded back under load puts your lower back at risk. Keep your back flat and your chest up."
            title: "Rounded back"
        2:
            text: "Standing up on every rep turns the row into a deadlift. Keep the same torso angle from start to finish."
            title: "Torso rising"
        3:
            text: "Pulling with your arms without squeezing your shoulder blades mostly works the biceps. Think about driving your elbows back."
            title: "Pulling with the arms"
    steps:
        1: "Stand with feet hip-width apart and grip the bar palms down, hands slightly wider than your shoulders."
        2: "Bend your knees slightly and hinge forward with a flat back, to about 45°."
        3: "With arms straight, let the bar hang below your shoulders and brace your abs."
        4: "Pull the bar towards your belly button, driving your elbows back and squeezing your shoulder blades."
        5: "Lower under control until your arms are straight, without moving your torso."
    variants:
        cable_row: "Constant tension and a supported back, ideal to finish a session."
        dumbbell_row: "One arm at a time, with a support that protects the lower back."

barbell_squat:
    intro: "The barbell squat is the king of leg exercises. It works the quads and glutes, helped by the hamstrings, adductors and the whole core."
    mistakes:
        1:
            text: "Knees caving inwards put stress on the joint. Push them out in line with your feet."
            title: "Knees caving in"
        2:
            text: "Lifting your heels shifts the weight onto your toes and knees. Keep your whole foot on the floor."
            title: "Heels lifting"
        3:
            text: "A back that rounds at the bottom exposes the lower back. Only go as low as you can while staying braced."
            title: "Back rounding"
        4:
            text: "A half squat lets you lift more but works the glutes less. Aim for at least thighs parallel to the floor."
            title: "Too short a range"
    steps:
        1: "Place the bar on your upper back (traps), hands slightly wider than your shoulders, elbows under the bar."
        2: "Unrack the bar, step back twice and set your feet shoulder-width apart, toes slightly turned out."
        3: "Breathe in, brace your core and sit down by pushing your hips back, knees in line with your feet."
        4: "Go down at least until your thighs are parallel to the floor, keeping your back straight."
        5: "Stand back up by pushing through your whole foot, and breathe out at the top."
    variants:
        barbell_front_squat: "Bar in front, more upright torso: more quads, less back."
        hack_squat: "Guided by the machine, to load the legs without managing balance."
        leg_press: "Back supported, to train heavy without loading the spine."

bench_press_bar:
    intro: "The bench press is the benchmark exercise for upper body strength. It mainly works the chest and front shoulders, helped by the triceps."
    mistakes:
        1:
            text: "With your arms at 90° from your torso, your shoulders take all the load. Keep your elbows at about 45°."
            title: "Elbows flared out"
        2:
            text: "Bouncing the bar off your chest steals work from your pecs. Touch lightly, without momentum."
            title: "Bouncing the bar"
        3:
            text: "Your hips stay on the bench. If they lift, the weight is too heavy."
            title: "Hips lifting off"
        4:
            text: "Going halfway down lets you lift more but brings less progress. Lower the bar to your chest."
            title: "Partial range"
    steps:
        1: "Lie on the bench with your eyes under the bar and your feet flat on the floor."
        2: "Grip the bar slightly wider than your shoulders, squeeze your shoulder blades and slightly arch your upper back."
        3: "Unrack the bar and hold it above your shoulders, arms straight."
        4: "Lower it under control until it touches your lower chest, elbows at about 45° from your torso."
        5: "Press the bar up as you breathe out, until your arms are straight again."
    variants:
        bench_press_dumbbell: "More range of motion, and each arm works on its own."
        decline_bench_press_bar: "Puts the emphasis on the lower chest."
        incline_bench_press_dumbbell: "Puts the emphasis on the upper chest."

