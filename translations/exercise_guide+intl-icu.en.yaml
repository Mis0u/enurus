    meta_description: "Strength training exercise guides sorted by muscle: muscles worked, technique, common mistakes and variations."
    title: "Strength training exercises by muscle"

leg_press:
    intro: "The leg press works the quads and glutes without loading the spine. It lets you push heavy safely, alongside or instead of the squat."
    mistakes:
        1:
            text: "Locking your knees at the top puts the whole load on the joint. Always keep them slightly bent."
            title: "Locked knees"
        2:
            text: "If your lower back lifts off the backrest at the bottom, you are going too low. Stop just before."
            title: "Hips lifting off"
        3:
            text: "Knees caving inwards put stress on the joint. Push them out in line with your feet."
            title: "Knees caving in"
    steps:
        1: "Sit down with your back and hips firmly against the backrest."
        2: "Place your feet in the middle of the platform, hip-width apart, toes slightly turned out."
        3: "Push the platform to unlock it, then release the safety handles."
        4: "Lower by bending your knees to about 90°, without lifting your hips off the backrest."
        5: "Push through your heels to extend, without locking your knees at the top."
    variants:
        barbell_squat: "The basic movement, which also trains balance and core strength."
        hack_squat: "Back supported too, but standing, closer to the squat."

military_press_bar:
    intro: "The military press is the basic exercise for strong shoulders. It works the front and side of the shoulders, helped by the triceps and traps."
    mistakes:
        1:
            text: "Leaning back turns the lift into an incline press and loads the lower back. Squeeze your glutes and abs."
            title: "Arching the back"
        2:
            text: "Pressing the bar in front of your face makes it heavier and tires the shoulders. It goes straight up; move your head back to let it pass."
            title: "Bar too far forward"
        3:
            text: "Stopping the bar at forehead level shortens the movement. Lower it to your upper chest."
            title: "Partial range"
    steps:
        1: "Stand with feet hip-width apart and grip the bar slightly wider than your shoulders."
        2: "Rest the bar on your upper chest, elbows slightly in front of the bar."
        3: "Squeeze your glutes and abs to keep your body straight."
        4: "Press the bar straight up overhead, moving your head back slightly to let it pass."
        5: "Finish with arms straight overhead, then lower under control to your chest."
    variants:
        arnold_press: "With dumbbells and a rotation, to work the shoulder through a larger range."
        military_press_machine: "Guided by the machine, to focus on pressing."

pull_up:
    intro: "Pull-ups with an overhand grip (palms facing away) are the king of exercises for a wide back. They mainly work the lats, helped by the biceps, traps and rear shoulders."
    mistakes:
        1:
            text: "Swinging your legs to get up steals work from your back. Keep your body braced and still."
            title: "Kipping with the legs"
        2:
            text: "Stopping before your chin clears the bar, or pulling again before your arms are straight, shortens the exercise. Go all the way."
            title: "Partial range"
        3:
            text: "Pulling only with your arms tires the biceps before the back. Start each rep by pulling your shoulders down."
            title: "Relaxed shoulders"
    steps:
        1: "Grip the bar overhand, hands slightly wider than your shoulders."
        2: "Hang with your arms straight, legs together and abs braced."
        3: "Pull your shoulders down and squeeze your shoulder blades to start the movement."
        4: "Pull by driving your elbows towards your hips until your chin clears the bar."
        5: "Lower slowly until your arms are fully straight."
    variants:
        chin_up: "Palms facing you, more biceps and often easier."
        lat_pulldown: "On a machine, to adjust the load while pull-ups are still too hard."

