deadlift:
    intro: "The deadlift works almost your whole body: lower back, glutes and hamstrings first, but also the quads, back and forearms. It is the exercise where you can lift the most, and the one where technique matters most."
    mistakes:
        1:
            text: "Lifting with a rounded back is the most dangerous mistake. If you cannot keep your back flat, the weight is too heavy."
            title: "Rounded back"
        2:
            text: "A bar drifting away from your legs pulls on your lower back. Slide it along your shins and then your thighs."
            title: "Bar away from the body"
        3:
            text: "Raising your hips before your shoulders turns it into a stiff-leg deadlift. Hips and shoulders rise together."
            title: "Hips shooting up"
        4:
            text: "Leaning back at the top crushes the lower back. Just finish standing tall."
            title: "Leaning back at the top"
    steps:
        1: "Stand with feet hip-width apart, the bar over the middle of your feet."
        2: "Hinge forward by pushing your hips back and grip the bar just outside your legs."
        3: "Bend your knees until your shins touch the bar, chest up and back flat."
        4: "Brace your core and push through the floor to lift the bar along your legs, hips and shoulders together."
        5: "Finish standing with your hips locked out, then lower the bar along the same path."
    variants:
        romanian_deadlift: "Legs almost straight, to target the hamstrings and glutes."
        stiff_leg_deadlift: "Legs straight, for a maximal stretch of the back of the thighs."

dips_chest:
    intro: "Parallel bar dips with the torso leaning forward are one of the best bodyweight exercises for the chest. The triceps and front shoulders help too."
    mistakes:
        1:
            text: "Going too low puts a strong stretch on the front of the shoulders. Stop when your upper arms are roughly parallel to the floor."
            title: "Going too deep"
        2:
            text: "With an upright torso, the triceps do most of the work. Lean forward to target the chest."
            title: "Torso too upright"
        3:
            text: "Letting your shoulders rise towards your ears puts them in a bad position. Keep them down and away from your ears."
            title: "Shoulders shrugging up"
    steps:
        1: "Grab the parallel bars and press up into support, arms straight, shoulders down."
        2: "Lean your torso forward and let your elbows flare out slightly."
        3: "Lower yourself by bending your elbows until your upper arms are roughly parallel to the floor."
        4: "Push into the bars to rise until your arms are straight."
    variants:
        bench_press_bar: "To train heavy and progress with plates."
        dips_triceps: "Upright torso, to target the back of the arms."
        push_up: "Easier, to learn the pushing movement."

incline_bench_press_dumbbell:
    intro: "The incline dumbbell press targets the upper chest and front shoulders. Dumbbells offer more range of motion than a bar and make each arm work on its own."
    mistakes:
        1:
            text: "Above 45°, your shoulders do most of the pressing. Stay between 30 and 45°."
            title: "Bench too steep"
        2:
            text: "Clanking the dumbbells at the top releases the tension. Bring them close without touching."
            title: "Dumbbells clanking"
        3:
            text: "Dropping the dumbbells at the bottom overloads the shoulders. Take two to three seconds to lower them."
            title: "Uncontrolled lowering"
    steps:
        1: "Set the bench between 30 and 45° and sit down with a dumbbell resting on each thigh."
        2: "Lie back while bringing the dumbbells to chest level, feet flat on the floor."
        3: "Squeeze your shoulder blades and hold the dumbbells above your upper chest, arms straight."
        4: "Lower slowly until you feel a stretch in your chest, elbows slightly below your shoulders."
        5: "Press the dumbbells up while bringing them slightly together, then repeat."
    variants:
        bench_press_bar: "Flat bench and barbell, to lift heavier."
        dumbbell_fly_incline: "Flyes on the same bench, to isolate the upper chest."
        incline_bench_press_bar: "With a barbell, to lift heavier at the same angle."

