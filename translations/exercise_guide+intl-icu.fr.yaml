deadlift:
    intro: "Le soulevé de terre sollicite presque tout le corps : lombaires, fessiers et ischio-jambiers en premier, mais aussi les quadriceps, le dos et les avant-bras. C'est l'exercice qui permet de soulever le plus lourd, et celui où la technique compte le plus."
    mistakes:
        1:
            text: "Soulever le dos rond est l'erreur la plus dangereuse. Si tu n'arrives pas à garder le dos plat, la charge est trop lourde."
            title: "Dos rond"
        2:
            text: "Une barre qui s'éloigne des jambes tire sur le bas du dos. Fais-la glisser le long des tibias puis des cuisses."
            title: "Barre loin du corps"
        3:
            text: "Monter les hanches avant les épaules transforme l'exercice en soulevé jambes tendues. Hanches et épaules montent ensemble."
            title: "Hanches qui montent trop vite"
        4:
            text: "Se pencher en arrière en haut du mouvement écrase les lombaires. Termine simplement debout, bien droit."
            title: "Hyperextension en haut"
    steps:
        1: "Place-toi debout, pieds largeur de hanches, la barre au-dessus du milieu des pieds."
        2: "Penche-toi en poussant les hanches vers l'arrière et saisis la barre juste à l'extérieur des jambes."
        3: "Fléchis les genoux jusqu'à ce que les tibias touchent la barre, poitrine sortie et dos plat."
        4: "Gaine le ventre et pousse dans le sol pour monter la barre le long des jambes, hanches et épaules ensemble."
        5: "Termine debout, hanches tendues, puis redescends en suivant le même chemin."
    variants:
        romanian_deadlift: "Jambes presque tendues, pour cibler les ischio-jambiers et les fessiers."
        stiff_leg_deadlift: "Jambes tendues, étirement maximal de l'arrière des cuisses."

dips_chest:
    intro: "Les dips aux barres parallèles, buste penché en avant, sont l'un des meilleurs exercices au poids du corps pour les pectoraux. Les triceps et l'avant des épaules participent aussi."
    mistakes:
        1:
            text: "Descendre trop bas étire fortement l'avant des épaules. Arrête-toi quand les bras sont à peu près parallèles au sol."
            title: "Descente trop profonde"
        2:
            text: "Buste vertical, ce sont surtout les triceps qui travaillent. Penche-toi en avant pour viser les pectoraux."
            title: "Buste trop droit"
        3:
            text: "Laisser les épaules monter vers les oreilles les met en mauvaise position. Garde-les basses et loin des oreilles."
            title: "Épaules qui remontent"
    steps:
        1: "Saisis les barres parallèles et monte en appui, bras tendus, épaules basses."
        2: "Penche le buste vers l'avant et laisse les coudes s'écarter légèrement."
        3: "Descends en fléchissant les coudes jusqu'à ce que les bras soient à peu près parallèles au sol."
        4: "Pousse dans les barres pour remonter jusqu'à tendre les bras."
    variants:
        bench_press_bar: "Pour charger lourd et progresser avec des disques."
        dips_triceps: "Buste droit, pour cibler l'arrière des bras."
        push_up: "Plus facile, pour apprendre le mouvement de poussée."

incline_bench_press_dumbbell:
    intro: "Le développé incliné aux haltères cible le haut des pectoraux et l'avant des épaules. Les haltères offrent plus d'amplitude que la barre et obligent chaque bras à travailler seul."
    mistakes:
        1:
            text: "Au-delà de 45°, ce sont surtout les épaules qui poussent. Reste entre 30 et 45°."
            title: "Banc trop incliné"
        2:
            text: "Taper les haltères en haut fait perdre la tension. Rapproche-les sans qu'ils se touchent."
            title: "Haltères qui s'entrechoquent"
        3:
            text: "Laisser tomber les haltères en bas sollicite trop les épaules. Contrôle la descente sur deux à trois secondes."
            title: "Descente non contrôlée"
    steps:
        1: "Règle le banc entre 30 et 45° et assieds-toi, un haltère posé sur chaque cuisse."
        2: "Allonge-toi en ramenant les haltères au niveau de la poitrine, pieds à plat au sol."
        3: "Serre les omoplates et place les haltères au-dessus du haut de la poitrine, bras tendus."
        4: "Descends lentement jusqu'à sentir l'étirement des pectoraux, coudes légèrement sous les épaules."
        5: "Pousse les haltères vers le haut en les rapprochant légèrement, puis recommence."
    variants:
        bench_press_bar: "Banc plat et barre, pour charger plus lourd."
        dumbbell_fly_incline: "Écartés sur le même banc, pour isoler le haut des pectoraux."
        incline_bench_press_bar: "À la barre, pour charger plus lourd sur le même angle."

index:
    heading: "Exercices de musculation"
    heading_highlight: "par muscle"
    intro: "Les muscles travaillés, l'exécution pas à pas, les erreurs fréquentes et les variantes de chaque exercice. Choisis un muscle, puis un exercice."
    meta_description: "Fiches d'exercices de musculation classées par muscle : muscles travaillés, exécution, erreurs fréquentes et variantes."
    title: "Exercices de musculation par muscle"

leg_press:
    intro: "La presse à cuisses travaille les quadriceps et les fessiers sans charge sur la colonne. Elle permet de pousser lourd en toute sécurité, en complément ou à la place du squat."
    mistakes:
        1:
            text: "Verrouiller les genoux en haut met toute la charge sur l'articulation. Garde-les toujours légèrement fléchis."
            title: "Genoux verrouillés"
        2:
            text: "Si le bas du dos décolle du dossier en bas du mouvement, tu descends trop bas. Arrête-toi juste avant."
            title: "Bassin qui décolle"
        3:
            text: "Des genoux qui rentrent vers l'intérieur fragilisent l'articulation. Pousse-les dans l'axe des pieds."
            title: "Genoux qui rentrent"
    steps:
        1: "Assieds-toi, le dos et les fesses bien calés contre le dossier."
        2: "Place les pieds au milieu de la plateforme, largeur de hanches, pointes légèrement ouvertes."
        3: "Pousse la plateforme pour la débloquer, puis retire les sécurités."
        4: "Descends en fléchissant les genoux jusqu'à environ 90°, sans décoller le bassin du dossier."
        5: "Pousse dans les talons pour remonter, sans verrouiller les genoux en haut."
    variants:
        barbell_squat: "Le mouvement de base, qui fait aussi travailler l'équilibre et le gainage."
        hack_squat: "Dos calé aussi, mais en position debout, plus proche du squat."

military_press_bar:
    intro: "Le développé militaire est l'exercice de base pour des épaules fortes. Il travaille l'avant et le côté des épaules, avec l'aide des triceps et des trapèzes."
    mistakes:
        1:
            text: "Se pencher en arrière transforme le mouvement en développé incliné et charge les lombaires. Serre les fessiers et les abdominaux."
            title: "Dos trop cambré"
        2:
            text: "Pousser la barre devant le visage la rend plus lourde et fatigue les épaules. Elle monte à la verticale, la tête recule à son passage."
            title: "Barre trop en avant"
        3:
            text: "Arrêter la barre au niveau du front raccourcit le mouvement. Redescends jusqu'au haut de la poitrine."
            title: "Amplitude partielle"
    steps:
        1: "Debout, pieds largeur de hanches, saisis la barre un peu plus large que les épaules."
        2: "Place la barre sur le haut de la poitrine, coudes légèrement devant la barre."
        3: "Serre les fessiers et les abdominaux pour garder le corps bien droit."
        4: "Pousse la barre à la verticale au-dessus de la tête, en reculant légèrement la tête pour la laisser passer."
        5: "Termine bras tendus au-dessus de la tête, puis redescends sous contrôle jusqu'à la poitrine."
    variants:
        arnold_press: "Aux haltères avec rotation, pour travailler l'épaule sur une plus grande amplitude."
        military_press_machine: "Guidé par la machine, pour se concentrer sur la poussée."

pull_up:
    intro: "Les tractions en pronation (paumes vers l'avant) sont l'exercice roi pour la largeur du dos. Elles travaillent surtout le grand dorsal, avec l'aide des biceps, des trapèzes et de l'arrière des épaules."
    mistakes:
        1:
            text: "Balancer les jambes pour monter vole le travail du dos. Garde le corps gainé et immobile."
            title: "Élan avec les jambes"
        2:
            text: "S'arrêter avant que le menton dépasse la barre ou remonter sans tendre les bras raccourcit l'exercice. Va d'un bout à l'autre."
            title: "Amplitude partielle"
        3:
            text: "Tirer seulement avec les bras fatigue les biceps avant le dos. Commence chaque répétition en abaissant les épaules."
            title: "Épaules relâchées"
    steps:
        1: "Saisis la barre en pronation, mains un peu plus larges que les épaules."
        2: "Suspends-toi bras tendus, jambes serrées et abdominaux gainés."
        3: "Abaisse les épaules et serre les omoplates pour démarrer le mouvement."
        4: "Tire en ramenant les coudes vers les hanches jusqu'à ce que le menton dépasse la barre."
        5: "Redescends lentement jusqu'à tendre complètement les bras."
    variants:
        chin_up: "Paumes vers toi, plus de biceps et souvent plus facile."
        lat_pulldown: "À la machine, pour régler la charge si les tractions sont encore trop dures."

