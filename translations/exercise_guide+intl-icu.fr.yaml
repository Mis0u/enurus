barbell_curl_standing:
    intro: "Le curl barre debout est l'exercice de base pour le volume des biceps. La barre droite permet de charger plus lourd qu'avec des haltères, à condition de garder le buste immobile."
    mistakes:
        1:
            text: "Balancer le buste pour monter la barre transfère l'effort sur le dos. Baisse la charge et garde le tronc immobile."
            title: "Élan du buste"
        2:
            text: "Si les coudes partent vers l'avant, les épaules prennent le relais. Garde-les le long du corps du début à la fin."
            title: "Coudes qui avancent"
        3:
            text: "Remonter avant d'avoir tendu les bras raccourcit le mouvement. Descends jusqu'à l'extension, sans relâcher la tension."
            title: "Descente incomplète"
    steps:
        1: "Debout, pieds largeur de hanches, saisis la barre en supination (paumes vers le haut), mains largeur d'épaules."
        2: "Bras tendus, colle les coudes contre les flancs et serre les abdominaux."
        3: "Fléchis les coudes pour monter la barre vers les épaules, sans bouger les coudes ni le buste."
        4: "Contracte les biceps en haut, puis redescends lentement jusqu'à tendre les bras."
    variants:
        dumbbell_curl_standing: "Chaque bras travaille seul, utile si un côté est plus faible."
        ez_bar_curl: "La barre coudée soulage les poignets et les coudes."
        preacher_curl: "Les bras calés sur le pupitre empêchent toute triche."

barbell_row:
    intro: "Le rowing barre construit l'épaisseur du dos : grand dorsal, trapèzes et arrière des épaules. C'est aussi un excellent exercice de gainage, le dos devant rester fixe pendant toute la série."
    mistakes:
        1:
            text: "Un dos arrondi sous la charge met les lombaires en danger. Garde le dos plat, la poitrine sortie."
            title: "Dos rond"
        2:
            text: "Se redresser à chaque répétition transforme le rowing en soulevé de terre. Le buste reste incliné de la même façon du début à la fin."
            title: "Buste qui se relève"
        3:
            text: "Tirer avec les bras sans serrer les omoplates fait travailler surtout les biceps. Pense à ramener les coudes vers l'arrière."
            title: "Tirer avec les bras"
    steps:
        1: "Debout, pieds largeur de hanches, saisis la barre en pronation, mains un peu plus larges que les épaules."
        2: "Fléchis légèrement les genoux et penche le buste vers l'avant, dos plat, jusqu'à environ 45°."
        3: "Bras tendus, laisse pendre la barre sous les épaules et gaine les abdominaux."
        4: "Tire la barre vers le nombril en ramenant les coudes vers l'arrière et en serrant les omoplates."
        5: "Redescends sous contrôle jusqu'à tendre les bras, sans bouger le buste."
    variants:
        cable_row: "Tension constante et dos soutenu, idéal pour finir la séance."
        dumbbell_row: "Un bras après l'autre, avec un appui qui protège le bas du dos."

barbell_squat:
    intro: "Le squat barre est le roi des exercices pour les jambes. Il travaille les quadriceps et les fessiers, avec le soutien des ischio-jambiers, des adducteurs et de toute la sangle abdominale."
    mistakes:
        1:
            text: "Des genoux qui rentrent vers l'intérieur fragilisent l'articulation. Pousse-les dans l'axe des pieds."
            title: "Genoux qui rentrent"
        2:
            text: "Décoller les talons fait basculer le poids sur l'avant du pied et sur les genoux. Garde tout le pied au sol."
            title: "Talons qui décollent"
        3:
            text: "Un dos qui s'arrondit en bas du mouvement expose les lombaires. Descends seulement aussi bas que tu restes gainé."
            title: "Dos qui s'arrondit"
        4:
            text: "Un squat à mi-hauteur permet plus de charge mais travaille moins les fessiers. Vise au moins les cuisses parallèles au sol."
            title: "Amplitude trop courte"
    steps:
        1: "Place la barre sur le haut du dos (trapèzes), mains un peu plus larges que les épaules, coudes sous la barre."
        2: "Décroche la barre, recule de deux pas et écarte les pieds largeur d'épaules, pointes légèrement ouvertes."
        3: "Inspire, gaine le ventre et descends en poussant les hanches vers l'arrière et les genoux dans l'axe des pieds."
        4: "Descends au moins jusqu'à avoir les cuisses parallèles au sol, en gardant le dos droit."
        5: "Remonte en poussant dans tout le pied, et expire en haut du mouvement."
    variants:
        barbell_front_squat: "Barre devant, buste plus droit : plus de quadriceps, moins de dos."
        hack_squat: "Guidé par la machine, pour charger les jambes sans gérer l'équilibre."
        leg_press: "Dos calé, pour travailler lourd sans charge sur la colonne."

bench_press_bar:
    intro: "Le développé couché est l'exercice de référence pour la force du haut du corps. Il travaille surtout les pectoraux et l'avant des épaules, avec l'aide des triceps."
    mistakes:
        1:
            text: "Bras à 90° du buste, les épaules encaissent tout. Garde les coudes à environ 45°."
            title: "Coudes trop écartés"
        2:
            text: "Le rebond sur la poitrine vole le travail des pectoraux. Marque un contact léger, sans élan."
            title: "Barre qui rebondit"
        3:
            text: "Le bassin reste sur le banc. S'il décolle, la charge est trop lourde."
            title: "Fesses qui décollent"
        4:
            text: "Descendre à mi-course permet plus de charge, mais moins de progrès. Va jusqu'à la poitrine."
            title: "Amplitude partielle"
    steps:
        1: "Allonge-toi sur le banc, les yeux sous la barre, les pieds bien à plat au sol."
        2: "Saisis la barre un peu plus large que les épaules, serre les omoplates et cambre légèrement le haut du dos."
        3: "Décroche la barre et place-la au-dessus des épaules, bras tendus."
        4: "Descends sous contrôle jusqu'à toucher le bas des pectoraux, coudes à environ 45° du buste."
        5: "Pousse la barre vers le haut en expirant, jusqu'à revenir bras tendus."
    variants:
        bench_press_dumbbell: "Plus d'amplitude, et chaque bras travaille seul."
        decline_bench_press_bar: "Met l'accent sur le bas des pectoraux."
        incline_bench_press_dumbbell: "Met l'accent sur le haut des pectoraux."

