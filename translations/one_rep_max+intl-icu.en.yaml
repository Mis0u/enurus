eyebrow: "Free tool"

faq:
    bodyweight:
        answer: "Your real load is part of your bodyweight plus any extra weight. On pull-ups you lift about 92 % of your bodyweight: at 78 kg with 10 kg added, the real load is about 82 kg. Enter that real load in the calculator."
        question: "What about pull-ups or dips?"
    formula:
        answer: "With the Epley formula, the most widely used one:"
        example: "Example: 80 kg lifted 6 times gives an estimated 1RM of 96 kg."
        expression: "1RM = weight × (1 + reps ÷ 30)"
        question: "How is it calculated?"
    max_reps:
        answer: "The longer the set, the more endurance comes into play and the less reliable the estimate. Beyond 10 reps, treat the result as a ballpark figure."
        question: "Why 12 reps at most?"
    testing:
        answer: "No need: the estimate is enough to set your training loads, without the risk of a max attempt. If you do want to test it, warm up well and have a spotter."
        question: "Should you test your true 1RM?"
    title: "All about the 1RM"
    what:
        answer: "Your 1RM (one-rep max) is the heaviest load you can lift once, with proper form. It is the reference for setting your training loads: working at 80 % of your 1RM, for example."
        question: "What is the 1RM?"

