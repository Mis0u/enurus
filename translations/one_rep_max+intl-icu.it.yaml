eyebrow: "Strumento gratuito"

faq:
    bodyweight:
        answer: "Il tuo carico reale è una parte del tuo peso corporeo più l'eventuale zavorra. Nelle trazioni sollevi circa il 92 % del tuo peso: a 78 kg con 10 kg di zavorra, il carico reale è di circa 82 kg. Inserisci questo carico reale nel calcolatore."
        question: "E per trazioni o dip?"
    formula:
        answer: "Con la formula di Epley, la più usata:"
        example: "Esempio: 80 kg sollevati 6 volte danno un 1RM stimato di 96 kg."
        expression: "1RM = peso × (1 + ripetizioni ÷ 30)"
        question: "Come si calcola?"
    max_reps:
        answer: "Più la serie è lunga, più entra in gioco la resistenza e meno la stima è affidabile. Oltre le 10 ripetizioni, considera il risultato un ordine di grandezza."
        question: "Perché al massimo 12 ripetizioni?"
    testing:
        answer: "Non serve: la stima basta per dosare le tue serie, senza il rischio di una prova massimale. Se vuoi comunque testarlo, scaldati bene e fatti assistere da un compagno."
        question: "Bisogna testare il proprio vero 1RM?"
    title: "Tutto sull'1RM"
    what:
        answer: "L'1RM (one-rep max) è il carico più pesante che puoi sollevare una sola volta, con una tecnica corretta. È il riferimento per dosare le tue serie: lavorare all'80 % del proprio 1RM, per esempio."
        question: "Che cos'è l'1RM?"

