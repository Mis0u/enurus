eyebrow: "Herramienta gratuita"

faq:
    bodyweight:
        answer: "Tu carga real es una parte de tu peso corporal más el lastre. En las dominadas levantas alrededor del 92 % de tu peso: con 78 kg y 10 kg de lastre, la carga real es de unos 82 kg. Introduce esa carga real en la calculadora."
        question: "¿Y para dominadas o fondos?"
    formula:
        answer: "Con la fórmula de Epley, la más utilizada:"
        example: "Ejemplo: 80 kg levantados 6 veces dan un 1RM estimado de 96 kg."
        expression: "1RM = peso × (1 + repeticiones ÷ 30)"
        question: "¿Cómo se calcula?"
    max_reps:
        answer: "Cuanto más larga es la serie, más influye la resistencia y menos fiable es la estimación. Por encima de 10 repeticiones, toma el resultado como un orden de magnitud."
        question: "¿Por qué 12 repeticiones como máximo?"
    testing:
        answer: "No hace falta: la estimación basta para ajustar tus series, sin el riesgo de un intento máximo. Si quieres probarlo, calienta bien y pide a alguien que te asista."
        question: "¿Hay que probar el 1RM real?"
    title: "Todo sobre el 1RM"
    what:
        answer: "El 1RM (one-rep max) es la carga más pesada que puedes levantar una sola vez, con buena técnica. Es la referencia para ajustar tus series: trabajar al 80 % de tu 1RM, por ejemplo."
        question: "¿Qué es el 1RM?"

