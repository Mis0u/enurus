    visitor:
        button: "Załóż darmowe konto"
        text: "Zapisuj serie, śledź rekordy i sprawdzaj, jakie mięśnie pracowały na każdym treningu. Za darmo i bez reklam."
        title: "Śledź swoje postępy"

deadlift:
    intro: "Martwy ciąg angażuje niemal całe ciało: przede wszystkim dolną część pleców, pośladki i mięśnie dwugłowe uda, ale też czworogłowe, plecy i przedramiona. W żadnym ćwiczeniu nie podniesiesz więcej i w żadnym technika nie liczy się bardziej."
    mistakes:
        1:
            text: "Podnoszenie z okrągłymi plecami to najgroźniejszy błąd. Jeśli nie potrafisz utrzymać prostych pleców, ciężar jest za duży."
            title: "Okrągłe plecy"
        2:
            text: "Sztanga oddalająca się od nóg ciągnie dolną część pleców. Prowadź ją wzdłuż goleni, a potem ud."
            title: "Sztanga daleko od ciała"
        3:
            text: "Unoszenie bioder przed barkami zamienia ćwiczenie w martwy ciąg na prostych nogach. Biodra i barki idą w górę razem."
            title: "Zbyt szybko unoszone biodra"
        4:
            text: "Odchylanie się do tyłu na górze miażdży odcinek lędźwiowy. Po prostu zakończ, stojąc prosto."
            title: "Przeprost na górze"
    steps:
        1: "Stań ze stopami na szerokość bioder, sztanga nad środkiem stóp."
        2: "Pochyl się, cofając biodra, i chwyć sztangę tuż na zewnątrz nóg."
        3: "Ugnij kolana, aż golenie dotkną sztangi, klatka wypchnięta, plecy proste."
        4: "Napnij brzuch i odepchnij się od podłogi, unosząc sztangę wzdłuż nóg, biodra i barki razem."
        5: "Zakończ w pozycji stojącej z wyprostowanymi biodrami, a potem opuść sztangę tą samą drogą."
    variants:
        romanian_deadlift: "Nogi prawie proste, by zaangażować mięśnie dwugłowe uda i pośladki."
        stiff_leg_deadlift: "Nogi proste, dla maksymalnego rozciągnięcia tylnej części ud."

dips_chest:
    intro: "Pompki na poręczach z tułowiem pochylonym do przodu to jedno z najlepszych ćwiczeń z masą ciała na klatkę piersiową. Pracują też tricepsy i przednia część barków."
    mistakes:
        1:
            text: "Zbyt głębokie opuszczanie mocno rozciąga przednią część barku. Zatrzymaj się, gdy ramiona są mniej więcej równoległe do podłogi."
            title: "Za głębokie opuszczanie"
        2:
            text: "Przy pionowym tułowiu pracują głównie tricepsy. Pochyl się do przodu, by zaangażować klatkę."
            title: "Zbyt wyprostowany tułów"
        3:
            text: "Barki unoszące się do uszu są w złej pozycji. Trzymaj je nisko, z dala od uszu."
            title: "Unoszące się barki"
    steps:
        1: "Chwyć poręcze i wejdź do podporu, ręce wyprostowane, barki nisko."
        2: "Pochyl tułów do przodu i pozwól łokciom lekko się rozejść."
        3: "Opuszczaj się, uginając łokcie, aż ramiona będą mniej więcej równoległe do podłogi."
        4: "Odepchnij się od poręczy, aż ręce się wyprostują."
    variants:
        bench_press_bar: "By trenować ciężko i dokładać talerze."
        dips_triceps: "Tułów wyprostowany, by zaangażować tył ramion."
        push_up: "Łatwiejsze, by nauczyć się ruchu wypychania."

incline_bench_press_dumbbell:
    intro: "Wyciskanie hantli na ławce skośnej celuje w górną część klatki i przednią część barków. Hantle dają większy zakres ruchu niż sztanga i zmuszają każdą rękę do osobnej pracy."
    mistakes:
        1:
            text: "Powyżej 45° wypychają głównie barki. Trzymaj się zakresu 30–45°."
            title: "Za stromo ustawiona ławka"
        2:
            text: "Uderzanie hantlami o siebie na górze zabiera napięcie. Zbliż je, ale tak, by się nie stykały."
            title: "Stukające hantle"
        3:
            text: "Upuszczanie hantli na dole przeciąża barki. Opuszczaj je przez dwie–trzy sekundy."
            title: "Niekontrolowane opuszczanie"
    steps:
        1: "Ustaw ławkę pod kątem 30–45° i usiądź z hantlami opartymi na udach."
        2: "Połóż się, przenosząc hantle na wysokość klatki, stopy płasko na podłodze."
        3: "Ściągnij łopatki i utrzymaj hantle nad górną częścią klatki na wyprostowanych rękach."
        4: "Opuszczaj je powoli, aż poczujesz rozciągnięcie klatki, łokcie lekko poniżej barków."
        5: "Wypchnij hantle w górę, lekko je do siebie zbliżając, i powtórz."
    variants:
        bench_press_bar: "Ławka płaska i sztanga, by użyć większego ciężaru."
        dumbbell_fly_incline: "Rozpiętki na tej samej ławce, by izolować górną część klatki."
        incline_bench_press_bar: "Ze sztangą, by użyć większego ciężaru pod tym samym kątem."

index:
    heading: "Ćwiczenia siłowe"
    heading_highlight: "według mięśni"
    intro: "Pracujące mięśnie, wykonanie krok po kroku, częste błędy i warianty każdego ćwiczenia. Wybierz mięsień, a potem ćwiczenie."
    meta_description: "Opisy ćwiczeń siłowych według mięśni: pracujące mięśnie, wykonanie, częste błędy i warianty."
    title: "Ćwiczenia siłowe według mięśni"

leg_press:
    intro: "Wypychanie nogami na suwnicy angażuje czworogłowe uda i pośladki bez obciążania kręgosłupa. Pozwala bezpiecznie pchać duży ciężar, jako uzupełnienie przysiadu lub zamiast niego."
    mistakes:
        1:
            text: "Blokowanie kolan na górze przenosi cały ciężar na staw. Zawsze trzymaj je lekko ugięte."
            title: "Zablokowane kolana"
        2:
            text: "Jeśli dolna część pleców odrywa się od oparcia na dole, schodzisz za nisko. Zatrzymaj się tuż przed tym."
            title: "Odrywająca się miednica"
        3:
            text: "Kolana uciekające do środka obciążają staw. Wypychaj je w kierunku stóp."
            title: "Kolana do środka"
    steps:
        1: "Usiądź, opierając plecy i pośladki o oparcie."
        2: "Postaw stopy na środku platformy, na szerokość bioder, palce lekko na zewnątrz."
        3: "Wypchnij platformę, by ją odblokować, i zwolnij zabezpieczenia."
        4: "Opuszczaj, uginając kolana do około 90°, nie odrywając miednicy od oparcia."
        5: "Wypchnij platformę piętami, nie blokując kolan na górze."
    variants:
        barbell_squat: "Ruch podstawowy, który ćwiczy też równowagę i mięśnie głębokie."
        hack_squat: "Również z oparciem pleców, ale na stojąco, bliżej przysiadu."

military_press_bar:
    intro: "Wyciskanie żołnierskie to podstawowe ćwiczenie na mocne barki. Angażuje przednią i boczną część barków, przy wsparciu tricepsów i mięśni czworobocznych."
    mistakes:
        1:
            text: "Odchylanie się do tyłu zamienia ruch w wyciskanie na skosie i obciąża odcinek lędźwiowy. Napnij pośladki i brzuch."
            title: "Zbyt wygięte plecy"
        2:
            text: "Wypychanie sztangi przed twarzą sprawia, że jest cięższa i męczy barki. Idzie pionowo w górę; głowa cofa się, by ją przepuścić."
            title: "Sztanga za daleko z przodu"
        3:
            text: "Zatrzymywanie sztangi na wysokości czoła skraca ruch. Opuszczaj ją do górnej części klatki."
            title: "Niepełny zakres ruchu"
    steps:
        1: "Stań ze stopami na szerokość bioder i chwyć sztangę nieco szerzej niż barki."
        2: "Oprzyj sztangę na górnej części klatki, łokcie lekko przed sztangą."
        3: "Napnij pośladki i brzuch, by utrzymać ciało w linii prostej."
        4: "Wypchnij sztangę pionowo nad głowę, lekko cofając głowę, by ją przepuścić."
        5: "Zakończ z wyprostowanymi rękami nad głową, a potem opuść sztangę w kontrolowany sposób do klatki."
    variants:
        arnold_press: "Z hantlami i rotacją, by pracować barkiem w większym zakresie."
        military_press_machine: "Prowadzone przez maszynę, by skupić się na wypychaniu."

pull_up:
    intro: "Podciąganie nachwytem (dłonie od siebie) to król ćwiczeń na szerokie plecy. Angażuje przede wszystkim najszersze grzbietu, przy wsparciu bicepsów, mięśni czworobocznych i tylnej części barków."
    mistakes:
        1:
            text: "Bujanie nogami przy podciąganiu zabiera pracę plecom. Trzymaj ciało napięte i nieruchome."
            title: "Bujanie nogami"
        2:
            text: "Zatrzymanie się, zanim broda minie drążek, albo podciąganie bez wyprostu rąk skraca ćwiczenie. Wykonuj pełny ruch."
            title: "Niepełny zakres ruchu"
        3:
            text: "Ciągnięcie samymi rękami męczy bicepsy szybciej niż plecy. Zaczynaj każde powtórzenie od opuszczenia barków."
            title: "Rozluźnione barki"
    steps:
        1: "Chwyć drążek nachwytem, dłonie nieco szerzej niż barki."
        2: "Zawiśnij na wyprostowanych rękach, nogi razem, brzuch napięty."
        3: "Opuść barki i ściągnij łopatki, by rozpocząć ruch."
        4: "Podciągaj się, prowadząc łokcie w stronę bioder, aż broda minie drążek."
        5: "Opuszczaj się powoli do pełnego wyprostu rąk."
    variants:
        chin_up: "Dłonie do siebie, więcej bicepsów i często łatwiej."
        lat_pulldown: "Na maszynie, by dobrać ciężar, dopóki podciąganie jest jeszcze za trudne."

