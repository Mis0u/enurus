barbell_curl_standing:
    intro: "Uginanie ramion ze sztangą stojąc to podstawowe ćwiczenie na masę bicepsów. Prosta sztanga pozwala użyć większego ciężaru niż hantle, o ile tułów pozostaje nieruchomy."
    mistakes:
        1:
            text: "Bujanie tułowiem przy podnoszeniu sztangi przenosi wysiłek na plecy. Zmniejsz ciężar i trzymaj tułów nieruchomo."
            title: "Bujanie tułowiem"
        2:
            text: "Gdy łokcie wysuwają się do przodu, pracę przejmują barki. Trzymaj je przy bokach od początku do końca."
            title: "Łokcie wędrują do przodu"
        3:
            text: "Podnoszenie sztangi przed wyprostowaniem rąk skraca ruch. Opuszczaj do pełnego wyprostu, nie tracąc napięcia."
            title: "Niepełne opuszczanie"
    steps:
        1: "Stań ze stopami na szerokość bioder i chwyć sztangę podchwytem (dłonie do góry), dłonie na szerokość barków."
        2: "Z wyprostowanymi rękami przyciśnij łokcie do boków i napnij brzuch."
        3: "Zegnij łokcie, by unieść sztangę w stronę barków, nie ruszając łokciami ani tułowiem."
        4: "Napnij bicepsy na górze, a potem powoli opuść sztangę do wyprostu rąk."
    variants:
        dumbbell_curl_standing: "Każda ręka pracuje osobno, przydatne, gdy jedna strona jest słabsza."
        ez_bar_curl: "Łamana sztanga odciąża nadgarstki i łokcie."
        preacher_curl: "Ręce oparte na modlitewniku uniemożliwiają oszukiwanie."

barbell_row:
    intro: "Wiosłowanie sztangą buduje grubość pleców: najszersze grzbietu, czworoboczne i tylną część barków. To także świetne ćwiczenie na mięśnie głębokie, bo plecy muszą pozostać nieruchome przez całą serię."
    mistakes:
        1:
            text: "Okrągłe plecy pod obciążeniem zagrażają odcinkowi lędźwiowemu. Trzymaj plecy proste, a klatkę wypchniętą."
            title: "Okrągłe plecy"
        2:
            text: "Prostowanie się przy każdym powtórzeniu zamienia wiosłowanie w martwy ciąg. Utrzymuj to samo pochylenie tułowia od początku do końca."
            title: "Prostujący się tułów"
        3:
            text: "Ciągnięcie rękami bez ściągania łopatek angażuje głównie bicepsy. Myśl o prowadzeniu łokci do tyłu."
            title: "Ciągnięcie rękami"
    steps:
        1: "Stań ze stopami na szerokość bioder i chwyć sztangę nachwytem, dłonie nieco szerzej niż barki."
        2: "Lekko ugnij kolana i pochyl tułów do przodu z prostymi plecami, do około 45°."
        3: "Z wyprostowanymi rękami pozwól sztandze zwisać pod barkami i napnij brzuch."
        4: "Przyciągnij sztangę do pępka, prowadząc łokcie do tyłu i ściągając łopatki."
        5: "Opuść ją w kontrolowany sposób do wyprostu rąk, nie ruszając tułowiem."
    variants:
        cable_row: "Stałe napięcie i podparte plecy, idealne na koniec treningu."
        dumbbell_row: "Jedna ręka naraz, z podparciem chroniącym dolną część pleców."

barbell_squat:
    intro: "Przysiad ze sztangą to król ćwiczeń na nogi. Pracują w nim czworogłowe uda i pośladki, wspierane przez mięśnie dwugłowe uda, przywodziciele i cały korpus."
    mistakes:
        1:
            text: "Kolana uciekające do środka obciążają staw. Wypychaj je w kierunku stóp."
            title: "Kolana do środka"
        2:
            text: "Odrywanie pięt przenosi ciężar na przodostopie i kolana. Trzymaj całą stopę na podłodze."
            title: "Odrywanie pięt"
        3:
            text: "Plecy zaokrąglające się na dole narażają odcinek lędźwiowy. Schodź tylko tak nisko, jak potrafisz utrzymać napięcie."
            title: "Zaokrąglające się plecy"
        4:
            text: "Półprzysiad pozwala na większy ciężar, ale słabiej angażuje pośladki. Schodź co najmniej do ud równoległych do podłogi."
            title: "Za mały zakres ruchu"
    steps:
        1: "Połóż sztangę na górnej części pleców (mięśnie czworoboczne), dłonie nieco szerzej niż barki, łokcie pod sztangą."
        2: "Zdejmij sztangę ze stojaka, cofnij się o dwa kroki i rozstaw stopy na szerokość barków, palce lekko na zewnątrz."
        3: "Weź wdech, napnij brzuch i schodź w dół, cofając biodra i prowadząc kolana w kierunku stóp."
        4: "Zejdź co najmniej do ud równoległych do podłogi, z prostymi plecami."
        5: "Wstań, odpychając się całą stopą, i zrób wydech na górze."
    variants:
        barbell_front_squat: "Sztanga z przodu, tułów bardziej wyprostowany: więcej czworogłowych, mniej pleców."
        hack_squat: "Prowadzony przez maszynę, by obciążyć nogi bez pilnowania równowagi."
        leg_press: "Plecy oparte, by trenować ciężko bez obciążania kręgosłupa."

bench_press_bar:
    intro: "Wyciskanie na ławce to ćwiczenie wzorcowe dla siły górnej części ciała. Angażuje przede wszystkim klatkę piersiową i przednią część barków, przy wsparciu tricepsów."
    mistakes:
        1:
            text: "Gdy ramiona są pod kątem 90° do tułowia, barki przyjmują cały ciężar. Trzymaj łokcie pod kątem około 45°."
            title: "Łokcie za szeroko"
        2:
            text: "Odbijanie sztangi od klatki zabiera pracę mięśniom piersiowym. Dotknij lekko, bez rozpędu."
            title: "Odbijanie sztangi"
        3:
            text: "Miednica zostaje na ławce. Jeśli się odrywa, ciężar jest za duży."
            title: "Odrywanie pośladków"
        4:
            text: "Opuszczanie tylko do połowy pozwala na większy ciężar, ale daje mniejsze postępy. Opuszczaj sztangę do klatki."
            title: "Niepełny zakres ruchu"
    steps:
        1: "Połóż się na ławce, oczy pod sztangą, stopy płasko na podłodze."
        2: "Chwyć sztangę nieco szerzej niż barki, ściągnij łopatki i lekko wygnij górną część pleców."
        3: "Zdejmij sztangę ze stojaka i utrzymaj ją nad barkami na wyprostowanych rękach."
        4: "Opuszczaj ją w kontrolowany sposób, aż dotknie dolnej części klatki, łokcie pod kątem około 45° do tułowia."
        5: "Wypchnij sztangę w górę na wydechu, aż ręce znów będą wyprostowane."
    variants:
        bench_press_dumbbell: "Większy zakres ruchu, a każda ręka pracuje osobno."
        decline_bench_press_bar: "Kładzie nacisk na dolną część klatki."
        incline_bench_press_dumbbell: "Kładzie nacisk na górną część klatki."

