contact:
    category:
        bug: Bug
        informative: Informative
        love: "Send some love"
        other: Other
        question: Question
        suggestion: Suggestion
        vote: Poll
    feedback:
        success: "Your message has been sent, thank you!"
    field:
        category: Category
        category_placeholder: Choose a category
        image: Image
        image_optional: "(optional — to illustrate a bug or a suggestion)"
        message: Message
        message_placeholder: "Describe your request in detail…"
        subject: Subject
        subject_placeholder: "Summarize your request in a few words"
    image:
        cta: Click to choose an image
        hint: "PNG, JPG — 5 MB max"
    intro: "A question, a bug to report, an idea for improvement? Write to me directly below. You'll get my reply in your internal Messages."
    restricted:
        duration:
            one_month: 1 month
            one_week: 1 week
        text_permanent: "Your access to the contact messaging has been permanently suspended."
        text_temporary: "Following abusive use of the contact messaging, your access to this form has been restricted for {duration}. You'll be able to send a message again once this period is over."
        title_permanent: Messaging access suspended
        title_temporary: Sending messages temporarily blocked
        until_label: Restriction lifted on
    submit: Send
    title: Contact
    welcome_thread:
        body: |-
            Hey {nickname}!

            A few pointers to help you find your way around:

            📚 Library — this is where you create your own exercises, in addition to the ones already available in the app.

            🗂️ Routine — groups a list of exercises you use often (e.g. "Push day"). Once created, you can select it directly when logging a new workout, so you don't have to re-enter your exercises every time.

            🏋️ Log a workout — this is where it all happens: pick your exercises (or your routine), enter weight/reps, and you're set.

            Have a great workout! 🔥
        subject: "Welcome to FitTracker 🎉"

