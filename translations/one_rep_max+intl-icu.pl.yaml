faq:
    bodyweight:
        answer: "Twoje rzeczywiste obciążenie to część masy ciała plus ewentualne dodatkowe obciążenie. Przy podciąganiu podnosisz około 92 % swojej masy: przy 78 kg i 10 kg obciążenia to około 82 kg. Wpisz to rzeczywiste obciążenie do kalkulatora."
        question: "A podciąganie lub dipy?"
    formula:
        answer: "Wzorem Epleya, najczęściej stosowanym:"
        example: "Przykład: 80 kg podniesione 6 razy dają szacowany 1RM równy 96 kg."
        expression: "1RM = ciężar × (1 + powtórzenia ÷ 30)"
        question: "Jak się go oblicza?"
    max_reps:
        answer: "Im dłuższa seria, tym większą rolę gra wytrzymałość i tym mniej dokładne jest oszacowanie. Powyżej 10 powtórzeń traktuj wynik jako rząd wielkości."
        question: "Dlaczego maksymalnie 12 powtórzeń?"
    testing:
        answer: "Nie trzeba: oszacowanie wystarczy, by dobrać obciążenia, bez ryzyka próby maksymalnej. Jeśli chcesz go sprawdzić, dobrze się rozgrzej i poproś kogoś o asekurację."
        question: "Czy trzeba testować prawdziwy 1RM?"
    title: "Wszystko o 1RM"
    what:
        answer: "1RM (one-rep max) to największy ciężar, jaki możesz podnieść jeden raz z poprawną techniką. To punkt odniesienia do doboru obciążeń: na przykład trening na 80 % swojego 1RM."
        question: "Czym jest 1RM?"

