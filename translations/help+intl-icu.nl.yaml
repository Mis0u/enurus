section:
    badges:
        intro: "Badges belonen je volharding en je vooruitgang, van brons tot robijn."
        open: "Mijn badges bekijken"
        points:
            families: "4 families: aantal trainingen, anciënniteit, regelmaat (trainingsweken op rij) en totale tonnage. Elk heeft 6 niveaus: brons, zilver, goud, platina, smaragd en robijn."
            legend: "Behaal de robijn in alle 4 families voor de ultieme badge: ‘Enurus-legende’."
            where: "Je vindt ze allemaal in ‘Mijn badges’, met je voortgang naar het volgende niveau. Een nieuwe badge wordt aangekondigd zodra je hem behaalt."
        title: "Badges"
    connections:
        intro: "Verbind je met je trainingspartners om elkaars vooruitgang te volgen."
        open: "Mijn verbindingen bekijken"
        points:
            control: "Jij kiest wat je verbindingen zien: je trainingen (optioneel) en de blokken van je dashboard. Je kunt een verbinding verwijderen of het delen op elk moment stoppen."
            principle: "Eenmaal verbonden zien jullie elk het dashboard van de ander, alleen-lezen."
            request: "Voer de code van een vriend in bij ‘Verbinding toevoegen’: hij ontvangt je verzoek (en een e-mail, die hij kan uitzetten) en kan het accepteren of weigeren."
            share: "Zet eerst ‘Mijn profiel delen’ aan: je krijgt een code om aan je vrienden te geven, in de vorm Alias#CODE."
        title: "Verbindingen"
    dashboard:
        intro: "Je dashboard vat je activiteit samen en wordt met elke training rijker."
        open: "Mijn dashboard bekijken"
        points:
            blocks: "Sessie (cijfers van je laatste trainingsdag, de week, de maand), Tonnage (totaal getild gewicht), Getrainde spieren, Regelmaat (weken op rij), Regelmaatdoel, Doelen, Badges, Verbindingen."
            customize: "Kies de getoonde blokken en hun volgorde in Instellingen › Dashboard-widgets (slepen of pijlen ↑ ↓). Daar zet je ook de Activiteitenkalender aan."
            progressive: "Na verloop van tijd worden nieuwe blokken ontgrendeld: vanaf je 2e training de regelmaat en de spieren van de week of maand, vanaf je eerste doel de doelen."
        title: "Dashboard"
    getting_started:
        intro: "Enurus houdt je krachttrainingen bij zodat je je vooruitgang ziet, week na week."
        open: "Een training registreren"
        points:
            come_back: "Ga terug naar je dashboard: het wordt met elke nieuwe training rijker."
            fill: "Voeg je oefeningen toe, daarna het gewicht en de herhalingen van elke set."
            log: "Registreer je eerste training met de knop ‘+’ (‘Registreer je training’ op de computer)."
        title: "Waar begin je"
    library:
        intro: "De bibliotheek bundelt de basisoefeningen en de oefeningen die je zelf maakt."
        open: "Bibliotheek openen"
        points:
            archive: "Een eigen oefening verwijderen die je al gebruikt hebt, archiveert haar: ze verdwijnt uit de bibliotheek, maar je geschiedenis blijft bewaard (filter ‘Gearchiveerd’)."
            bodyweight: "Geef bij een oefening met lichaamsgewicht (optrekken, dips…) aan welk deel van je gewicht je tilt: het telt mee in je tonnage als je gewicht in de instellingen is ingevuld."
            browse: "Basisoefeningen hebben een blauwe streep, die van jou een rode. Zoek op naam of filter op spier."
            create: "‘Oefening aanmaken’: geef haar een naam, de primaire en secundaire spieren en hoe ze gemeten wordt (gewicht en herhalingen, duur of afstand)."
            goals: "Stel op diezelfde pagina een doel in (bijvoorbeeld 100 kg × 5): de voortgang verschijnt op je dashboard."
            history: "Het grafiekpictogram van een oefening opent haar geschiedenis: voortgangscurve, eerdere trainingen en records."
        title: "Bibliotheek en oefeningen"
    messaging:
        intro: "Een vraag, een bug, een idee? Ik antwoord je rechtstreeks."
        open: "Contact opnemen"
        points:
            answer: "Het antwoord komt binnen in je Berichten: een stip wijst op nieuwe berichten."
            contact: "Schrijf me via ‘Contact’ en kies een categorie. Je kunt een screenshot bijvoegen."
        title: "Contact en berichten"
    routines:
        intro: "Een routine is een lijst oefeningen die je vaak doet, bijvoorbeeld ‘Push day’."
        open: "Mijn routines bekijken"
        points:
            order: "Zet de oefeningen in een andere volgorde door ze te verslepen."
            use: "Kies bij het registreren van een training je routine: al haar oefeningen worden in één keer toegevoegd, in volgorde."
            what: "Maak haar één keer aan via ‘Mijn routines’ en voeg je oefeningen toe."
        title: "Routines"
    settings:
        intro: "Pas Enurus aan je gewoontes aan via de Instellingen."
        open: "Instellingen openen"
        points:
            account: "Wijzig je wachtwoord of verwijder je account: de verwijdering kan 30 dagen lang worden geannuleerd."
            bodyweight: "Je lichaamsgewicht wordt gebruikt om de tonnage van oefeningen met lichaamsgewicht te berekenen."
            profile: "Alias, avatar, taal en geslacht (dat het spiersilhouet bepaalt)."
            unit: "Gewichtseenheid (kg of lbs): de hele weergave past zich aan, zonder iets aan je geschiedenis te veranderen."
        title: "Instellingen"
    workout_log:
        intro: "Alles gebeurt op de pagina ‘Registreer je training’."
        open: "Een training registreren"
        points:
            date: "De datum van vandaag is al ingevuld: wijzig hem als je een eerdere training registreert."
            details: "Je kunt ook de duur, je stemming en een opmerking noteren en een foto toevoegen."
            draft: "Wat je invoert, wordt 1 uur als concept op je apparaat bewaard: verlaat je de pagina of herlaadt de app, dan vind je het terug als je terugkomt."
            exercises: "‘Oefening toevoegen’ opent de lijst: vink meerdere oefeningen aan en bevestig. Je gebruikelijke oefeningen staan bovenaan."
            missing_exercise: "Ontbreekt er een oefening? Maak haar aan vanuit de lijst: daarna keer je terug naar je training, met de oefening toegevoegd."
            prefill: "Doe je een oefening opnieuw, dan worden de gewichten van je laatste training automatisch overgenomen (‘Overgenomen van je training van…’): je hoeft ze alleen aan te passen."
            records: "Bij het bevestigen worden je nieuwe records (PR's) en nieuwe badges aangekondigd."
            routine: "Je kunt vertrekken vanuit een routine: al haar oefeningen worden in één keer toegevoegd."
            sets: "Geef voor elke set het gewicht en de herhalingen op (of de duur, of de afstand, afhankelijk van de oefening). ‘Deze set herhalen’ kopieert de vorige."
        title: "Een training registreren"
    workouts:
        intro: "‘Mijn trainingen’ bevat je volledige geschiedenis."
        open: "Mijn trainingen bekijken"
        points:
            calendar: "Het tabblad ‘Kalender’ toont je activiteit over het jaar: hoe donkerder een vakje, hoe meer je die dag hebt getild vergeleken met je andere trainingen. Een training zonder gewicht (cardio, plank…) verschijnt in de lichtste tint."
            deload: "Daar plan je ook je rustweken (deload): ze onderbreken je reeks trainingsweken niet."
            detail: "Open een training om je sets, de getrainde spieren en je records te zien. Je kunt hem bewerken of verwijderen."
            list: "Je trainingen van nieuw naar oud, te filteren op datum, week, maand, routine of getrainde spier."
            regularity_goal: "Ook in ‘Kalender’ stel je een regelmaatdoel in: bijvoorbeeld 3 trainingen per week gedurende 4 weken, of 1 training per dag gedurende 2 weken. De duur kies je in hele weken van 7 dagen, vanaf de startdatum. Elke dag of week moet zijn quotum halen (twee trainingen op dezelfde dag tellen dubbel). Een doel gaat niet samen met een rustweek: je kunt het ene niet tijdens het andere plannen. Volg je voortgang in de widget ‘Regelmaatdoel’ van je overzicht. Eén doel tegelijk, dat je kunt opgeven. Uitdaging gehaald? Een feestje wacht op je zodra je de training vastlegt die haar voltooit."
        title: "Mijn trainingen"
summary: "Inhoud"
title: "Hulp"
