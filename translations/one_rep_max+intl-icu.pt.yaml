eyebrow: "Ferramenta gratuita"

faq:
    bodyweight:
        answer: "A tua carga real é uma parte do teu peso corporal mais o lastro. Nas elevações levantas cerca de 92 % do teu peso: com 78 kg e 10 kg de lastro, a carga real é de cerca de 82 kg. Introduz essa carga real na calculadora."
        question: "E para elevações ou fundos?"
    formula:
        answer: "Com a fórmula de Epley, a mais utilizada:"
        example: "Exemplo: 80 kg levantados 6 vezes dão um 1RM estimado de 96 kg."
        expression: "1RM = peso × (1 + repetições ÷ 30)"
        question: "Como é calculado?"
    max_reps:
        answer: "Quanto mais longa a série, mais a resistência entra em jogo e menos fiável é a estimativa. Acima de 10 repetições, considera o resultado uma ordem de grandeza."
        question: "Porquê 12 repetições no máximo?"
    testing:
        answer: "Não é preciso: a estimativa chega para ajustar as tuas séries, sem o risco de uma tentativa máxima. Se quiseres testar, aquece bem e pede a alguém que te ajude."
        question: "Deve-se testar o verdadeiro 1RM?"
    title: "Tudo sobre o 1RM"
    what:
        answer: "O 1RM (one-rep max) é a carga mais pesada que consegues levantar uma única vez, com boa técnica. É a referência para ajustar as tuas séries: treinar a 80 % do teu 1RM, por exemplo."
        question: "O que é o 1RM?"

