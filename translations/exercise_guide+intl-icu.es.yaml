barbell_curl_standing:
    intro: "El curl con barra de pie es el ejercicio básico para ganar volumen en los bíceps. La barra recta permite cargar más que con mancuernas, siempre que el torso se mantenga quieto."
    mistakes:
        1:
            text: "Balancear el torso para subir la barra traslada el esfuerzo a la espalda. Baja el peso y mantén el tronco inmóvil."
            title: "Impulso con el torso"
        2:
            text: "Si los codos se adelantan, los hombros toman el relevo. Mantenlos pegados al cuerpo de principio a fin."
            title: "Codos que se adelantan"
        3:
            text: "Volver a subir antes de estirar los brazos acorta el movimiento. Baja hasta la extensión sin perder la tensión."
            title: "Bajada incompleta"
    steps:
        1: "De pie, con los pies a la anchura de las caderas, agarra la barra en supinación (palmas hacia arriba), manos a la anchura de los hombros."
        2: "Con los brazos estirados, pega los codos a los costados y contrae el abdomen."
        3: "Flexiona los codos para subir la barra hacia los hombros, sin mover los codos ni el torso."
        4: "Contrae los bíceps arriba y baja despacio hasta estirar los brazos."
    variants:
        dumbbell_curl_standing: "Cada brazo trabaja por separado, útil si un lado es más débil."
        ez_bar_curl: "La barra Z alivia las muñecas y los codos."
        preacher_curl: "Los brazos apoyados en el banco impiden hacer trampa."

barbell_row:
    intro: "El remo con barra construye una espalda gruesa: dorsal ancho, trapecios y parte posterior de los hombros. También es un gran ejercicio de core, ya que la espalda debe mantenerse fija durante toda la serie."
    mistakes:
        1:
            text: "Una espalda redondeada bajo carga pone en riesgo la zona lumbar. Mantén la espalda plana y el pecho fuera."
            title: "Espalda redondeada"
        2:
            text: "Incorporarte en cada repetición convierte el remo en un peso muerto. Mantén la misma inclinación del torso de principio a fin."
            title: "Torso que se incorpora"
        3:
            text: "Tirar con los brazos sin juntar las escápulas trabaja sobre todo los bíceps. Piensa en llevar los codos hacia atrás."
            title: "Tirar con los brazos"
    steps:
        1: "De pie, con los pies a la anchura de las caderas, agarra la barra en pronación, manos algo más abiertas que los hombros."
        2: "Flexiona ligeramente las rodillas e inclina el torso hacia delante, con la espalda plana, hasta unos 45°."
        3: "Con los brazos estirados, deja colgar la barra bajo los hombros y contrae el abdomen."
        4: "Tira de la barra hacia el ombligo llevando los codos hacia atrás y juntando las escápulas."
        5: "Baja de forma controlada hasta estirar los brazos, sin mover el torso."
    variants:
        cable_row: "Tensión constante y espalda apoyada, ideal para terminar la sesión."
        dumbbell_row: "Un brazo tras otro, con un apoyo que protege la zona lumbar."

barbell_squat:
    intro: "La sentadilla con barra es la reina de los ejercicios de pierna. Trabaja los cuádriceps y los glúteos, con la ayuda de los isquiotibiales, los aductores y todo el core."
    mistakes:
        1:
            text: "Las rodillas que se van hacia dentro sobrecargan la articulación. Empújalas en la dirección de los pies."
            title: "Rodillas hacia dentro"
        2:
            text: "Levantar los talones lleva el peso a la punta del pie y a las rodillas. Mantén todo el pie en el suelo."
            title: "Talones que se levantan"
        3:
            text: "Una espalda que se redondea abajo expone la zona lumbar. Baja solo hasta donde puedas mantenerte firme."
            title: "Espalda que se redondea"
        4:
            text: "Una media sentadilla permite más carga pero trabaja menos los glúteos. Baja al menos hasta tener los muslos paralelos al suelo."
            title: "Recorrido demasiado corto"
    steps:
        1: "Coloca la barra en la parte alta de la espalda (trapecios), manos algo más abiertas que los hombros, codos bajo la barra."
        2: "Desengancha la barra, retrocede dos pasos y separa los pies a la anchura de los hombros, puntas ligeramente abiertas."
        3: "Inspira, contrae el abdomen y baja llevando la cadera hacia atrás y las rodillas en la dirección de los pies."
        4: "Baja al menos hasta tener los muslos paralelos al suelo, con la espalda recta."
        5: "Sube empujando con todo el pie y espira arriba."
    variants:
        barbell_front_squat: "Barra delante, torso más recto: más cuádriceps, menos espalda."
        hack_squat: "Guiada por la máquina, para cargar las piernas sin preocuparte del equilibrio."
        leg_press: "Espalda apoyada, para entrenar pesado sin carga en la columna."

bench_press_bar:
    intro: "El press de banca es el ejercicio de referencia para la fuerza del tren superior. Trabaja sobre todo el pecho y la parte delantera de los hombros, con la ayuda de los tríceps."
    mistakes:
        1:
            text: "Con los brazos a 90° del torso, los hombros cargan con todo. Mantén los codos a unos 45°."
            title: "Codos demasiado abiertos"
        2:
            text: "El rebote en el pecho le roba trabajo a los pectorales. Toca ligeramente, sin impulso."
            title: "Barra que rebota"
        3:
            text: "La pelvis se queda en el banco. Si se levanta, el peso es demasiado alto."
            title: "Glúteos que se despegan"
        4:
            text: "Bajar solo hasta la mitad permite más carga, pero menos progreso. Baja la barra hasta el pecho."
            title: "Recorrido parcial"
    steps:
        1: "Túmbate en el banco con los ojos bajo la barra y los pies bien apoyados en el suelo."
        2: "Agarra la barra algo más abierta que los hombros, junta las escápulas y arquea ligeramente la parte alta de la espalda."
        3: "Desengancha la barra y colócala sobre los hombros, con los brazos estirados."
        4: "Baja de forma controlada hasta tocar la parte baja del pecho, codos a unos 45° del torso."
        5: "Empuja la barra hacia arriba espirando, hasta volver a estirar los brazos."
    variants:
        bench_press_dumbbell: "Más recorrido, y cada brazo trabaja por separado."
        decline_bench_press_bar: "Pone el acento en la parte baja del pecho."
        incline_bench_press_dumbbell: "Pone el acento en la parte alta del pecho."

