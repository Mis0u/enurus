deadlift:
    intro: "Kreuzheben beansprucht fast den ganzen Körper: zuerst unteren Rücken, Gesäß und Beinbeuger, aber auch Quadrizeps, Rücken und Unterarme. Bei keiner Übung bewegst du mehr Gewicht, und bei keiner zählt die Technik mehr."
    mistakes:
        1:
            text: "Mit rundem Rücken zu heben ist der gefährlichste Fehler. Schaffst du es nicht, den Rücken gerade zu halten, ist das Gewicht zu schwer."
            title: "Runder Rücken"
        2:
            text: "Entfernt sich die Stange von den Beinen, zieht sie am unteren Rücken. Führe sie an den Schienbeinen und dann an den Oberschenkeln entlang."
            title: "Stange zu weit vom Körper"
        3:
            text: "Steigt die Hüfte vor den Schultern, wird daraus Kreuzheben mit gestreckten Beinen. Hüfte und Schultern steigen gemeinsam."
            title: "Hüfte schießt nach oben"
        4:
            text: "Sich oben nach hinten zu lehnen staucht die Lendenwirbelsäule. Steh am Ende einfach aufrecht."
            title: "Überstrecken am Ende"
    steps:
        1: "Stell dich hüftbreit hin, die Stange über der Fußmitte."
        2: "Beuge dich vor, indem du die Hüfte nach hinten schiebst, und greif die Stange direkt außerhalb der Beine."
        3: "Beuge die Knie, bis die Schienbeine die Stange berühren, Brust raus und Rücken gerade."
        4: "Spann den Bauch an und drück dich vom Boden weg, um die Stange an den Beinen entlang zu heben, Hüfte und Schultern gemeinsam."
        5: "Steh am Ende mit gestreckter Hüfte aufrecht und senke die Stange auf demselben Weg wieder ab."
    variants:
        romanian_deadlift: "Beine fast gestreckt, für Beinbeuger und Gesäß."
        stiff_leg_deadlift: "Beine gestreckt, für maximale Dehnung der Oberschenkelrückseite."

dips_chest:
    intro: "Dips am Barren mit nach vorne geneigtem Oberkörper gehören zu den besten Körpergewichtsübungen für die Brust. Trizeps und vordere Schulter arbeiten mit."
    mistakes:
        1:
            text: "Zu tiefes Absenken dehnt die vordere Schulter stark. Stopp, wenn die Oberarme etwa parallel zum Boden sind."
            title: "Zu tief absenken"
        2:
            text: "Mit aufrechtem Oberkörper arbeitet vor allem der Trizeps. Lehn dich nach vorne, um die Brust zu treffen."
            title: "Oberkörper zu aufrecht"
        3:
            text: "Ziehen die Schultern zu den Ohren hoch, sind sie in einer schlechten Position. Halte sie tief und weg von den Ohren."
            title: "Hochgezogene Schultern"
    steps:
        1: "Greif die Barrenholme und drück dich in den Stütz, Arme gestreckt, Schultern tief."
        2: "Neige den Oberkörper nach vorne und lass die Ellenbogen leicht nach außen gehen."
        3: "Senke dich durch Beugen der Ellenbogen, bis die Oberarme etwa parallel zum Boden sind."
        4: "Drück dich von den Holmen nach oben, bis die Arme gestreckt sind."
    variants:
        bench_press_bar: "Um schwer zu trainieren und mit Scheiben zu steigern."
        dips_triceps: "Oberkörper aufrecht, für die Rückseite der Arme."
        push_up: "Leichter, um die Drückbewegung zu lernen."

incline_bench_press_dumbbell:
    intro: "Schrägbankdrücken mit Kurzhanteln zielt auf die obere Brust und die vordere Schulter. Kurzhanteln bieten mehr Bewegungsumfang als die Langhantel und lassen jeden Arm für sich arbeiten."
    mistakes:
        1:
            text: "Über 45° drücken vor allem die Schultern. Bleib zwischen 30 und 45°."
            title: "Bank zu steil"
        2:
            text: "Schlagen die Hanteln oben zusammen, geht die Spannung verloren. Führe sie zusammen, ohne dass sie sich berühren."
            title: "Hanteln schlagen zusammen"
        3:
            text: "Lässt du die Hanteln unten fallen, werden die Schultern überlastet. Senke sie über zwei bis drei Sekunden ab."
            title: "Unkontrolliertes Absenken"
    steps:
        1: "Stell die Bank auf 30 bis 45° ein und setz dich, je eine Kurzhantel auf einem Oberschenkel."
        2: "Leg dich zurück und bring die Hanteln auf Brusthöhe, Füße flach auf dem Boden."
        3: "Zieh die Schulterblätter zusammen und halte die Hanteln mit gestreckten Armen über der oberen Brust."
        4: "Senke sie langsam, bis du die Dehnung in der Brust spürst, Ellenbogen leicht unter Schulterhöhe."
        5: "Drück die Hanteln nach oben und führe sie dabei leicht zusammen, dann wiederholen."
    variants:
        bench_press_bar: "Flachbank und Langhantel, um mehr Gewicht zu bewegen."
        dumbbell_fly_incline: "Fliegende auf derselben Bank, um die obere Brust zu isolieren."
        incline_bench_press_bar: "Mit der Langhantel, um im selben Winkel mehr Gewicht zu bewegen."

index:
    heading: "Kraftübungen"
    heading_highlight: "nach Muskel"
    intro: "Trainierte Muskeln, Ausführung Schritt für Schritt, häufige Fehler und Varianten jeder Übung. Wähle einen Muskel, dann eine Übung."
    meta_description: "Anleitungen für Kraftübungen nach Muskel sortiert: trainierte Muskeln, Ausführung, häufige Fehler und Varianten."
    title: "Kraftübungen nach Muskel"

leg_press:
    intro: "Die Beinpresse trainiert Quadrizeps und Gesäß ohne Last auf der Wirbelsäule. Mit ihr drückst du sicher schwere Gewichte, als Ergänzung oder anstelle der Kniebeuge."
    mistakes:
        1:
            text: "Durchgestreckte Knie oben legen die ganze Last auf das Gelenk. Lass sie immer leicht gebeugt."
            title: "Durchgestreckte Knie"
        2:
            text: "Löst sich der untere Rücken unten von der Lehne, gehst du zu tief. Stopp kurz davor."
            title: "Becken hebt ab"
        3:
            text: "Knie, die nach innen fallen, belasten das Gelenk. Drück sie in Richtung der Fußspitzen."
            title: "Knie fallen nach innen"
    steps:
        1: "Setz dich hin, Rücken und Gesäß fest an der Lehne."
        2: "Stell die Füße hüftbreit in die Mitte der Plattform, Fußspitzen leicht nach außen."
        3: "Drück die Plattform weg, um sie zu entriegeln, und löse dann die Sicherungen."
        4: "Senke sie durch Beugen der Knie bis etwa 90°, ohne dass das Becken von der Lehne abhebt."
        5: "Drück dich über die Fersen nach oben, ohne die Knie oben durchzustrecken."
    variants:
        barbell_squat: "Die Grundbewegung, die auch Gleichgewicht und Rumpf trainiert."
        hack_squat: "Auch mit angelehntem Rücken, aber im Stehen, näher an der Kniebeuge."

military_press_bar:
    intro: "Das Schulterdrücken mit der Langhantel ist die Grundübung für starke Schultern. Es trainiert vordere und seitliche Schulter, unterstützt von Trizeps und Trapez."
    mistakes:
        1:
            text: "Lehnst du dich nach hinten, wird daraus Schrägbankdrücken und der untere Rücken wird belastet. Spann Gesäß und Bauch an."
            title: "Zu starkes Hohlkreuz"
        2:
            text: "Drückst du die Stange vor dem Gesicht, wird sie schwerer und ermüdet die Schultern. Sie steigt senkrecht, der Kopf weicht kurz nach hinten aus."
            title: "Stange zu weit vorne"
        3:
            text: "Stoppst du die Stange auf Stirnhöhe, verkürzt sich die Bewegung. Senke sie bis zur oberen Brust."
            title: "Halbe Bewegung"
    steps:
        1: "Stell dich hüftbreit hin und greif die Stange etwas weiter als schulterbreit."
        2: "Leg die Stange auf die obere Brust, Ellenbogen leicht vor der Stange."
        3: "Spann Gesäß und Bauch an, um den Körper gerade zu halten."
        4: "Drück die Stange senkrecht über den Kopf und nimm den Kopf leicht zurück, um sie vorbeizulassen."
        5: "Ende mit gestreckten Armen über dem Kopf und senke die Stange dann kontrolliert zur Brust."
    variants:
        arnold_press: "Mit Kurzhanteln und Drehung, für einen größeren Bewegungsumfang der Schulter."
        military_press_machine: "Von der Maschine geführt, um dich aufs Drücken zu konzentrieren."

pull_up:
    intro: "Klimmzüge im Obergriff (Handflächen nach vorne) sind die Königsübung für einen breiten Rücken. Sie trainieren vor allem den Latissimus, unterstützt von Bizeps, Trapez und hinterer Schulter."
    mistakes:
        1:
            text: "Schwung aus den Beinen nimmt dem Rücken die Arbeit ab. Halte den Körper angespannt und ruhig."
            title: "Schwung aus den Beinen"
        2:
            text: "Wer stoppt, bevor das Kinn über der Stange ist, oder wieder zieht, bevor die Arme gestreckt sind, verkürzt die Übung. Geh den ganzen Weg."
            title: "Halbe Bewegung"
        3:
            text: "Ziehst du nur mit den Armen, ermüdet der Bizeps vor dem Rücken. Beginne jede Wiederholung, indem du die Schultern nach unten ziehst."
            title: "Lockere Schultern"
    steps:
        1: "Greif die Stange im Obergriff, Hände etwas weiter als schulterbreit."
        2: "Häng dich mit gestreckten Armen hin, Beine geschlossen, Bauch angespannt."
        3: "Zieh die Schultern nach unten und die Schulterblätter zusammen, um die Bewegung zu starten."
        4: "Zieh dich hoch, indem du die Ellenbogen Richtung Hüfte führst, bis das Kinn über der Stange ist."
        5: "Senke dich langsam ab, bis die Arme ganz gestreckt sind."
    variants:
        chin_up: "Handflächen zu dir, mehr Bizeps und oft leichter."
        lat_pulldown: "An der Maschine, um das Gewicht anzupassen, solange Klimmzüge noch zu schwer sind."

