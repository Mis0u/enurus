barbell_curl_standing:
    intro: "Der stehende Langhantel-Curl ist die Grundübung für mehr Bizepsvolumen. Mit der geraden Stange bewegst du mehr Gewicht als mit Kurzhanteln, solange der Oberkörper ruhig bleibt."
    mistakes:
        1:
            text: "Wenn du mit dem Oberkörper Schwung holst, arbeitet der Rücken statt des Bizeps. Nimm weniger Gewicht und halte den Rumpf ruhig."
            title: "Schwung aus dem Oberkörper"
        2:
            text: "Wandern die Ellenbogen nach vorne, übernehmen die Schultern. Halte sie von Anfang bis Ende seitlich am Körper."
            title: "Ellenbogen wandern nach vorne"
        3:
            text: "Wer wieder hochzieht, bevor die Arme gestreckt sind, verkürzt die Bewegung. Senke die Stange bis zur Streckung, ohne die Spannung zu verlieren."
            title: "Unvollständiges Absenken"
    steps:
        1: "Stell dich hüftbreit hin und greif die Stange im Untergriff (Handflächen nach oben), Hände schulterbreit."
        2: "Lass die Arme gestreckt, leg die Ellenbogen seitlich an den Körper und spann den Bauch an."
        3: "Beuge die Ellenbogen und führe die Stange zu den Schultern, ohne Ellenbogen oder Oberkörper zu bewegen."
        4: "Spann den Bizeps oben an und senke die Stange dann langsam, bis die Arme gestreckt sind."
    variants:
        dumbbell_curl_standing: "Jeder Arm arbeitet für sich, praktisch bei einer schwächeren Seite."
        ez_bar_curl: "Die SZ-Stange schont Handgelenke und Ellenbogen."
        preacher_curl: "Die Arme liegen auf dem Pult, Mogeln ist unmöglich."

barbell_row:
    intro: "Langhantelrudern baut einen dichten Rücken auf: Latissimus, Trapez und hintere Schulter. Es ist auch eine hervorragende Rumpfübung, denn der Rücken muss den ganzen Satz über stabil bleiben."
    mistakes:
        1:
            text: "Ein runder Rücken unter Last gefährdet die Lendenwirbelsäule. Halte den Rücken gerade und die Brust raus."
            title: "Runder Rücken"
        2:
            text: "Richtest du dich bei jeder Wiederholung auf, wird aus dem Rudern Kreuzheben. Halte die Oberkörperneigung von Anfang bis Ende."
            title: "Oberkörper richtet sich auf"
        3:
            text: "Ziehst du nur mit den Armen, ohne die Schulterblätter zusammenzuziehen, arbeitet vor allem der Bizeps. Denk daran, die Ellenbogen nach hinten zu führen."
            title: "Nur mit den Armen ziehen"
    steps:
        1: "Stell dich hüftbreit hin und greif die Stange im Obergriff, Hände etwas weiter als schulterbreit."
        2: "Beuge die Knie leicht und neige den Oberkörper mit geradem Rücken auf etwa 45° nach vorne."
        3: "Lass die Stange mit gestreckten Armen unter den Schultern hängen und spann den Bauch an."
        4: "Zieh die Stange zum Bauchnabel, führe die Ellenbogen nach hinten und zieh die Schulterblätter zusammen."
        5: "Senke die Stange kontrolliert, bis die Arme gestreckt sind, ohne den Oberkörper zu bewegen."
    variants:
        cable_row: "Konstante Spannung und gestützter Rücken, ideal zum Abschluss des Trainings."
        dumbbell_row: "Ein Arm nach dem anderen, mit einer Stütze, die den unteren Rücken schützt."

barbell_squat:
    intro: "Die Kniebeuge mit Langhantel ist die Königin der Beinübungen. Sie trainiert Quadrizeps und Gesäß, unterstützt von Beinbeugern, Adduktoren und der gesamten Rumpfmuskulatur."
    mistakes:
        1:
            text: "Knie, die nach innen fallen, belasten das Gelenk. Drück sie in Richtung der Fußspitzen."
            title: "Knie fallen nach innen"
        2:
            text: "Heben die Fersen ab, verlagert sich das Gewicht auf Vorfuß und Knie. Lass den ganzen Fuß am Boden."
            title: "Fersen heben ab"
        3:
            text: "Ein Rücken, der unten rund wird, gefährdet die Lendenwirbelsäule. Geh nur so tief, wie du stabil bleibst."
            title: "Rücken wird rund"
        4:
            text: "Eine halbe Kniebeuge erlaubt mehr Gewicht, trainiert das Gesäß aber weniger. Geh mindestens bis die Oberschenkel parallel zum Boden sind."
            title: "Zu geringe Bewegungstiefe"
    steps:
        1: "Leg die Stange auf den oberen Rücken (Trapez), Hände etwas weiter als schulterbreit, Ellenbogen unter der Stange."
        2: "Heb die Stange aus, geh zwei Schritte zurück und stell die Füße schulterbreit, Fußspitzen leicht nach außen."
        3: "Atme ein, spann den Bauch an und geh nach unten, indem du die Hüfte nach hinten schiebst, Knie in Richtung der Füße."
        4: "Geh mindestens so tief, dass die Oberschenkel parallel zum Boden sind, mit geradem Rücken."
        5: "Drück dich über den ganzen Fuß nach oben und atme oben aus."
    variants:
        barbell_front_squat: "Stange vorne, Oberkörper aufrechter: mehr Quadrizeps, weniger Rücken."
        hack_squat: "Von der Maschine geführt, um die Beine zu belasten, ohne auf das Gleichgewicht zu achten."
        leg_press: "Rücken angelehnt, für schweres Training ohne Last auf der Wirbelsäule."

bench_press_bar:
    intro: "Bankdrücken ist die Referenzübung für Kraft im Oberkörper. Es trainiert vor allem Brust und vordere Schulter, unterstützt vom Trizeps."
    mistakes:
        1:
            text: "Sind die Arme im 90°-Winkel zum Oberkörper, tragen die Schultern die ganze Last. Halte die Ellenbogen bei etwa 45°."
            title: "Ellenbogen zu weit abgespreizt"
        2:
            text: "Lässt du die Stange von der Brust abfedern, nimmst du der Brust die Arbeit ab. Berühre sie leicht, ohne Schwung."
            title: "Stange federt ab"
        3:
            text: "Das Becken bleibt auf der Bank. Hebt es ab, ist das Gewicht zu schwer."
            title: "Gesäß hebt ab"
        4:
            text: "Nur bis zur Hälfte abzusenken erlaubt mehr Gewicht, bringt aber weniger Fortschritt. Senke die Stange bis zur Brust."
            title: "Halbe Bewegung"
    steps:
        1: "Leg dich auf die Bank, die Augen unter der Stange, die Füße flach auf dem Boden."
        2: "Greif die Stange etwas weiter als schulterbreit, zieh die Schulterblätter zusammen und mach im oberen Rücken ein leichtes Hohlkreuz."
        3: "Heb die Stange aus und halte sie mit gestreckten Armen über den Schultern."
        4: "Senke sie kontrolliert, bis sie die untere Brust berührt, Ellenbogen etwa 45° vom Oberkörper."
        5: "Drück die Stange beim Ausatmen nach oben, bis die Arme wieder gestreckt sind."
    variants:
        bench_press_dumbbell: "Mehr Bewegungsumfang, und jeder Arm arbeitet für sich."
        decline_bench_press_bar: "Betont die untere Brust."
        incline_bench_press_dumbbell: "Betont die obere Brust."

