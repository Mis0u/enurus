eyebrow: "Kostenloses Tool"

faq:
    bodyweight:
        answer: "Deine echte Last ist ein Teil deines Körpergewichts plus Zusatzgewicht. Bei Klimmzügen hebst du etwa 92 % deines Gewichts: bei 78 kg mit 10 kg Zusatzgewicht sind das rund 82 kg. Gib diese echte Last in den Rechner ein."
        question: "Und bei Klimmzügen oder Dips?"
    formula:
        answer: "Mit der Epley-Formel, der gebräuchlichsten:"
        example: "Beispiel: 80 kg, 6 Mal gehoben, ergeben ein geschätztes 1RM von 96 kg."
        expression: "1RM = Gewicht × (1 + Wiederholungen ÷ 30)"
        question: "Wie wird es berechnet?"
    max_reps:
        answer: "Je länger der Satz, desto mehr spielt die Ausdauer mit und desto ungenauer wird die Schätzung. Ab 10 Wiederholungen ist das Ergebnis nur ein Richtwert."
        question: "Warum höchstens 12 Wiederholungen?"
    testing:
        answer: "Nicht nötig: Die Schätzung reicht, um deine Sätze zu dosieren, ohne das Risiko eines Maximalversuchs. Wenn du es testen willst, wärm dich gut auf und lass dich sichern."
        question: "Sollte man sein echtes 1RM testen?"
    title: "Alles über das 1RM"
    what:
        answer: "Das 1RM (One-Rep-Max) ist die schwerste Last, die du mit sauberer Technik ein einziges Mal heben kannst. Es ist die Referenz, um deine Sätze zu dosieren: etwa mit 80 % deines 1RM trainieren."
        question: "Was ist das 1RM?"

