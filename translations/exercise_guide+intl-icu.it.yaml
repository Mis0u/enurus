        title: "Segui i tuoi progressi"

deadlift:
    intro: "Lo stacco da terra sollecita quasi tutto il corpo: zona lombare, glutei e femorali prima di tutto, ma anche quadricipiti, schiena e avambracci. È l'esercizio con cui si solleva di più, e quello in cui la tecnica conta di più."
    mistakes:
        1:
            text: "Sollevare a schiena curva è l'errore più pericoloso. Se non riesci a tenere la schiena piatta, il carico è troppo pesante."
            title: "Schiena curva"
        2:
            text: "Un bilanciere che si allontana dalle gambe tira sulla zona lombare. Fallo scorrere lungo le tibie e poi lungo le cosce."
            title: "Bilanciere lontano dal corpo"
        3:
            text: "Alzare i fianchi prima delle spalle trasforma l'esercizio in uno stacco a gambe tese. Fianchi e spalle salgono insieme."
            title: "Fianchi che salgono troppo presto"
        4:
            text: "Inclinarsi all'indietro in alto schiaccia la zona lombare. Termina semplicemente in piedi, ben dritto."
            title: "Iperestensione in alto"
    steps:
        1: "Mettiti in piedi, piedi alla larghezza dei fianchi, il bilanciere sopra il centro dei piedi."
        2: "Piegati spingendo i fianchi indietro e impugna il bilanciere appena all'esterno delle gambe."
        3: "Fletti le ginocchia finché le tibie toccano il bilanciere, petto in fuori e schiena piatta."
        4: "Contrai l'addome e spingi contro il pavimento per sollevare il bilanciere lungo le gambe, fianchi e spalle insieme."
        5: "Termina in piedi con i fianchi estesi, poi riporta giù il bilanciere seguendo lo stesso percorso."
    variants:
        romanian_deadlift: "Gambe quasi tese, per lavorare femorali e glutei."
        stiff_leg_deadlift: "Gambe tese, per un allungamento massimo della parte posteriore delle cosce."

dips_chest:
    intro: "Le dip alle parallele con il busto inclinato in avanti sono uno dei migliori esercizi a corpo libero per il petto. Partecipano anche i tricipiti e la parte anteriore delle spalle."
    mistakes:
        1:
            text: "Scendere troppo allunga molto la parte anteriore della spalla. Fermati quando le braccia sono più o meno parallele al pavimento."
            title: "Discesa troppo profonda"
        2:
            text: "Con il busto verticale lavorano soprattutto i tricipiti. Inclinati in avanti per colpire il petto."
            title: "Busto troppo dritto"
        3:
            text: "Lasciar salire le spalle verso le orecchie le mette in cattiva posizione. Tienile basse e lontane dalle orecchie."
            title: "Spalle che salgono"
    steps:
        1: "Afferra le parallele e sali in appoggio, braccia tese e spalle basse."
        2: "Inclina il busto in avanti e lascia che i gomiti si aprano leggermente."
        3: "Scendi flettendo i gomiti finché le braccia sono più o meno parallele al pavimento."
        4: "Spingi sulle parallele per risalire fino a distendere le braccia."
    variants:
        bench_press_bar: "Per caricare pesante e progredire con i dischi."
        dips_triceps: "Busto dritto, per lavorare la parte posteriore delle braccia."
        push_up: "Più facile, per imparare il movimento di spinta."

incline_bench_press_dumbbell:
    intro: "La panca inclinata con manubri lavora la parte alta del petto e la parte anteriore delle spalle. I manubri offrono più ampiezza del bilanciere e obbligano ogni braccio a lavorare da solo."
    mistakes:
        1:
            text: "Oltre i 45° spingono soprattutto le spalle. Resta tra 30 e 45°."
            title: "Panca troppo inclinata"
        2:
            text: "Far sbattere i manubri in alto fa perdere la tensione. Avvicinali senza che si tocchino."
            title: "Manubri che sbattono"
        3:
            text: "Lasciar cadere i manubri in basso sovraccarica le spalle. Controlla la discesa per due o tre secondi."
            title: "Discesa non controllata"
    steps:
        1: "Regola la panca tra 30 e 45° e siediti con un manubrio appoggiato su ogni coscia."
        2: "Sdraiati portando i manubri all'altezza del petto, piedi ben appoggiati a terra."
        3: "Stringi le scapole e porta i manubri sopra la parte alta del petto, a braccia tese."
        4: "Scendi lentamente fino a sentire l'allungamento dei pettorali, gomiti leggermente sotto le spalle."
        5: "Spingi i manubri verso l'alto avvicinandoli leggermente, poi ricomincia."
    variants:
        bench_press_bar: "Panca piana e bilanciere, per caricare di più."
        dumbbell_fly_incline: "Croci sulla stessa panca, per isolare la parte alta del petto."
        incline_bench_press_bar: "Con il bilanciere, per caricare di più con la stessa inclinazione."

