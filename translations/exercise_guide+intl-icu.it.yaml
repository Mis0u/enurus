barbell_curl_standing:
    intro: "Il curl con bilanciere in piedi è l'esercizio di base per il volume dei bicipiti. Il bilanciere dritto permette di caricare più che con i manubri, a patto di tenere fermo il busto."
    mistakes:
        1:
            text: "Dondolare il busto per sollevare il bilanciere sposta lo sforzo sulla schiena. Riduci il carico e tieni fermo il tronco."
            title: "Slancio del busto"
        2:
            text: "Se i gomiti avanzano, sono le spalle a lavorare. Tienili lungo i fianchi dall'inizio alla fine."
            title: "Gomiti che avanzano"
        3:
            text: "Risalire prima di aver disteso le braccia accorcia il movimento. Scendi fino all'estensione senza perdere la tensione."
            title: "Discesa incompleta"
    steps:
        1: "In piedi, piedi alla larghezza dei fianchi, impugna il bilanciere in supinazione (palmi verso l'alto), mani alla larghezza delle spalle."
        2: "A braccia tese, porta i gomiti contro i fianchi e contrai gli addominali."
        3: "Fletti i gomiti per portare il bilanciere verso le spalle, senza muovere gomiti né busto."
        4: "Contrai i bicipiti in alto, poi scendi lentamente fino a distendere le braccia."
    variants:
        dumbbell_curl_standing: "Ogni braccio lavora da solo, utile se un lato è più debole."
        ez_bar_curl: "Il bilanciere sagomato alleggerisce polsi e gomiti."
        preacher_curl: "Le braccia appoggiate sulla panca impediscono di barare."

barbell_row:
    intro: "Il rematore con bilanciere costruisce lo spessore della schiena: gran dorsale, trapezi e parte posteriore delle spalle. È anche un ottimo esercizio per il core, perché la schiena deve restare ferma per tutta la serie."
    mistakes:
        1:
            text: "Una schiena curva sotto carico mette a rischio la zona lombare. Tieni la schiena piatta e il petto in fuori."
            title: "Schiena curva"
        2:
            text: "Raddrizzarsi a ogni ripetizione trasforma il rematore in uno stacco. Mantieni la stessa inclinazione del busto dall'inizio alla fine."
            title: "Busto che si raddrizza"
        3:
            text: "Tirare con le braccia senza stringere le scapole fa lavorare soprattutto i bicipiti. Pensa a portare i gomiti indietro."
            title: "Tirare con le braccia"
    steps:
        1: "In piedi, piedi alla larghezza dei fianchi, impugna il bilanciere in pronazione, mani un po' più larghe delle spalle."
        2: "Fletti leggermente le ginocchia e inclina il busto in avanti a schiena piatta, fino a circa 45°."
        3: "A braccia tese, lascia pendere il bilanciere sotto le spalle e contrai gli addominali."
        4: "Tira il bilanciere verso l'ombelico portando i gomiti indietro e stringendo le scapole."
        5: "Scendi in modo controllato fino a distendere le braccia, senza muovere il busto."
    variants:
        cable_row: "Tensione costante e schiena sostenuta, ideale per chiudere la seduta."
        dumbbell_row: "Un braccio alla volta, con un appoggio che protegge la zona lombare."

barbell_squat:
    intro: "Lo squat con bilanciere è il re degli esercizi per le gambe. Lavora quadricipiti e glutei, con l'aiuto di femorali, adduttori e di tutto il core."
    mistakes:
        1:
            text: "Le ginocchia che rientrano sollecitano l'articolazione. Spingile nella direzione dei piedi."
            title: "Ginocchia che rientrano"
        2:
            text: "Sollevare i talloni sposta il peso sull'avampiede e sulle ginocchia. Tieni tutto il piede a terra."
            title: "Talloni che si sollevano"
        3:
            text: "Una schiena che si incurva in basso espone la zona lombare. Scendi solo fin dove riesci a restare stabile."
            title: "Schiena che si incurva"
        4:
            text: "Un mezzo squat permette più carico ma lavora meno i glutei. Scendi almeno fino ad avere le cosce parallele al pavimento."
            title: "Ampiezza troppo corta"
    steps:
        1: "Posiziona il bilanciere sulla parte alta della schiena (trapezi), mani un po' più larghe delle spalle, gomiti sotto il bilanciere."
        2: "Sgancia il bilanciere, fai due passi indietro e apri i piedi alla larghezza delle spalle, punte leggermente in fuori."
        3: "Inspira, contrai l'addome e scendi spingendo i fianchi indietro e le ginocchia nella direzione dei piedi."
        4: "Scendi almeno fino ad avere le cosce parallele al pavimento, con la schiena dritta."
        5: "Risali spingendo con tutto il piede ed espira in alto."
    variants:
        barbell_front_squat: "Bilanciere davanti, busto più dritto: più quadricipiti, meno schiena."
        hack_squat: "Guidato dalla macchina, per caricare le gambe senza pensare all'equilibrio."
        leg_press: "Schiena appoggiata, per allenarti pesante senza carico sulla colonna."

bench_press_bar:
    intro: "La panca piana è l'esercizio di riferimento per la forza della parte superiore del corpo. Lavora soprattutto i pettorali e la parte anteriore delle spalle, con l'aiuto dei tricipiti."
    mistakes:
        1:
            text: "Con le braccia a 90° dal busto, sono le spalle a reggere tutto. Tieni i gomiti a circa 45°."
            title: "Gomiti troppo aperti"
        2:
            text: "Il rimbalzo sul petto ruba lavoro ai pettorali. Tocca leggermente, senza slancio."
            title: "Bilanciere che rimbalza"
        3:
            text: "Il bacino resta sulla panca. Se si stacca, il carico è troppo pesante."
            title: "Glutei che si staccano"
        4:
            text: "Scendere solo a metà permette più carico, ma meno progressi. Porta il bilanciere fino al petto."
            title: "Ampiezza parziale"
    steps:
        1: "Sdraiati sulla panca con gli occhi sotto il bilanciere e i piedi ben appoggiati a terra."
        2: "Impugna il bilanciere un po' più largo delle spalle, stringi le scapole e inarca leggermente la parte alta della schiena."
        3: "Sgancia il bilanciere e portalo sopra le spalle, a braccia tese."
        4: "Scendi in modo controllato fino a toccare la parte bassa del petto, gomiti a circa 45° dal busto."
        5: "Spingi il bilanciere verso l'alto espirando, fino a tornare a braccia tese."
    variants:
        bench_press_dumbbell: "Più ampiezza, e ogni braccio lavora da solo."
        decline_bench_press_bar: "Mette l'accento sulla parte bassa del petto."
        incline_bench_press_dumbbell: "Mette l'accento sulla parte alta del petto."

