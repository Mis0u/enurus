    heading_highlight: "per muscolo"
    intro: "I muscoli lavorati, l'esecuzione passo dopo passo, gli errori frequenti e le varianti di ogni esercizio. Scegli un muscolo, poi un esercizio."
    meta_description: "Schede di esercizi di muscolazione divise per muscolo: muscoli lavorati, esecuzione, errori frequenti e varianti."
    title: "Esercizi di muscolazione per muscolo"

leg_press:
    intro: "La leg press lavora quadricipiti e glutei senza carico sulla colonna. Permette di spingere pesante in sicurezza, in aggiunta o al posto dello squat."
    mistakes:
        1:
            text: "Bloccare le ginocchia in alto scarica tutto il peso sull'articolazione. Tienile sempre leggermente flesse."
            title: "Ginocchia bloccate"
        2:
            text: "Se la zona lombare si stacca dallo schienale in basso, stai scendendo troppo. Fermati poco prima."
            title: "Bacino che si stacca"
        3:
            text: "Le ginocchia che rientrano sollecitano l'articolazione. Spingile nella direzione dei piedi."
            title: "Ginocchia che rientrano"
    steps:
        1: "Siediti con la schiena e i glutei ben appoggiati allo schienale."
        2: "Posiziona i piedi al centro della pedana, alla larghezza dei fianchi, punte leggermente in fuori."
        3: "Spingi la pedana per sbloccarla, poi togli le sicure."
        4: "Scendi flettendo le ginocchia fino a circa 90°, senza staccare il bacino dallo schienale."
        5: "Spingi con i talloni per risalire, senza bloccare le ginocchia in alto."
    variants:
        barbell_squat: "Il movimento di base, che allena anche equilibrio e core."
        hack_squat: "Anche qui con la schiena appoggiata, ma in piedi, più vicino allo squat."

military_press_bar:
    intro: "Il lento avanti con bilanciere è l'esercizio di base per spalle forti. Lavora la parte anteriore e laterale delle spalle, con l'aiuto di tricipiti e trapezi."
    mistakes:
        1:
            text: "Inclinarsi all'indietro trasforma il movimento in una panca inclinata e carica la zona lombare. Contrai glutei e addominali."
            title: "Schiena troppo inarcata"
        2:
            text: "Spingere il bilanciere davanti al viso lo rende più pesante e affatica le spalle. Sale in verticale; la testa arretra per lasciarlo passare."
            title: "Bilanciere troppo avanti"
        3:
            text: "Fermare il bilanciere all'altezza della fronte accorcia il movimento. Riportalo fino alla parte alta del petto."
            title: "Ampiezza parziale"
    steps:
        1: "In piedi, piedi alla larghezza dei fianchi, impugna il bilanciere un po' più largo delle spalle."
        2: "Appoggia il bilanciere sulla parte alta del petto, gomiti leggermente davanti al bilanciere."
        3: "Contrai glutei e addominali per tenere il corpo dritto."
        4: "Spingi il bilanciere in verticale sopra la testa, arretrando leggermente la testa per lasciarlo passare."
        5: "Termina a braccia tese sopra la testa, poi scendi in modo controllato fino al petto."
    variants:
        arnold_press: "Con manubri e rotazione, per lavorare la spalla con più ampiezza."
        military_press_machine: "Guidato dalla macchina, per concentrarti sulla spinta."

pull_up:
    intro: "Le trazioni in pronazione (palmi in avanti) sono l'esercizio re per una schiena larga. Lavorano soprattutto il gran dorsale, con l'aiuto di bicipiti, trapezi e parte posteriore delle spalle."
    mistakes:
        1:
            text: "Dondolare le gambe per salire ruba lavoro alla schiena. Tieni il corpo contratto e immobile."
            title: "Slancio con le gambe"
        2:
            text: "Fermarsi prima che il mento superi la sbarra, o risalire senza distendere le braccia, accorcia l'esercizio. Fai tutto il movimento."
            title: "Ampiezza parziale"
        3:
            text: "Tirare solo con le braccia affatica i bicipiti prima della schiena. Inizia ogni ripetizione abbassando le spalle."
            title: "Spalle rilassate"
    steps:
        1: "Afferra la sbarra in pronazione, mani un po' più larghe delle spalle."
        2: "Appenditi a braccia tese, gambe unite e addominali contratti."
        3: "Abbassa le spalle e stringi le scapole per avviare il movimento."
        4: "Tira portando i gomiti verso i fianchi finché il mento supera la sbarra."
        5: "Scendi lentamente fino a distendere completamente le braccia."
    variants:
        chin_up: "Palmi verso di te, più bicipiti e spesso più facile."
        lat_pulldown: "Alla macchina, per regolare il carico finché le trazioni sono ancora troppo difficili."

