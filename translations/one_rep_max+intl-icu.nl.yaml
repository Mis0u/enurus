eyebrow: "Gratis tool"

faq:
    bodyweight:
        answer: "Je echte belasting is een deel van je lichaamsgewicht plus extra gewicht. Bij optrekken til je ongeveer 92 % van je gewicht: bij 78 kg met 10 kg extra is de echte belasting ongeveer 82 kg. Vul die echte belasting in de calculator in."
        question: "En bij optrekken of dips?"
    formula:
        answer: "Met de formule van Epley, de meest gebruikte:"
        example: "Voorbeeld: 80 kg die je 6 keer tilt, geven een geschatte 1RM van 96 kg."
        expression: "1RM = gewicht × (1 + herhalingen ÷ 30)"
        question: "Hoe wordt het berekend?"
    max_reps:
        answer: "Hoe langer de set, hoe meer uithoudingsvermogen meespeelt en hoe minder betrouwbaar de schatting. Boven de 10 herhalingen is het resultaat een grootteorde."
        question: "Waarom maximaal 12 herhalingen?"
    testing:
        answer: "Niet nodig: de schatting volstaat om je sets te doseren, zonder het risico van een maximale poging. Wil je het toch testen, warm dan goed op en laat iemand je assisteren."
        question: "Moet je je echte 1RM testen?"
    title: "Alles over de 1RM"
    what:
        answer: "De 1RM (one-rep max) is het zwaarste gewicht dat je met goede techniek één keer kunt tillen. Het is de referentie om je sets te doseren: trainen op 80 % van je 1RM, bijvoorbeeld."
        question: "Wat is de 1RM?"

