            📚 <a href="{library_url}">Bibliothèque</a> — c'est ici que tu crées tes propres exercices, en plus de ceux déjà proposés par l'app.

            🗂️ <a href="{routine_url}">Routine</a> — regroupe une liste d'exercices que tu utilises souvent (ex. "Push day"). Une fois créée, tu pourras la sélectionner directement en créant une nouvelle séance, pour ne pas ressaisir tes exercices à chaque fois.

            🏋️ <a href="{workout_url}">Créer une séance</a> — c'est là que tout se joue : choisis tes exercices (ou ta routine), renseigne poids/répétitions, et voilà.

