            Hoi {nickname}!

            Een paar aanwijzingen om je wegwijs te maken:

            📚 <a href="{library_url}">Bibliotheek</a> — hier maak je je eigen oefeningen aan, naast de oefeningen die de app al aanbiedt.

            🗂️ <a href="{routine_url}">Routine</a> — bundelt een lijst met oefeningen die je vaak gebruikt (bv. "Push day"). Eenmaal aangemaakt, kun je hem direct selecteren bij het aanmaken van een nieuwe training, zodat je niet elke keer opnieuw je oefeningen hoeft in te voeren.

            🏋️ <a href="{workout_url}">Training aanmaken</a> — hier gebeurt het allemaal: kies je oefeningen (of je routine), vul gewicht/herhalingen in, en klaar.

            Veel trainingsplezier! 🔥
