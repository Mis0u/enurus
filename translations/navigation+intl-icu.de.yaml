        subject: Betreff
        subject_placeholder: "Fasse dein Anliegen in wenigen Worten zusammen"
    image:
        cta: Klicke, um ein Bild auszuwählen
        hint: "PNG, JPG — max. 5 MB"
    intro: "Eine Frage, ein Fehler zu melden, eine Verbesserungsidee? Schreib mir direkt unten. Du erhältst meine Antwort in deinen internen Nachrichten."
    restricted:
        duration:
            one_month: 1 Monat
            one_week: 1 Woche
        text_permanent: "Dein Zugang zum Kontakt-Nachrichtensystem wurde dauerhaft gesperrt."
        text_temporary: "Aufgrund missbräuchlicher Nutzung des Kontakt-Nachrichtensystems wurde dein Zugang zu diesem Formular für {duration} eingeschränkt. Du kannst nach Ablauf dieser Frist wieder eine Nachricht senden."
        title_permanent: Nachrichtenzugang gesperrt
        title_temporary: Nachrichtenversand vorübergehend blockiert
        until_label: Einschränkung aufgehoben am
    submit: Senden
    title: Kontakt
    welcome_thread:
        body: |-
            Hallo {nickname}!

            Ein paar Hinweise zur Orientierung:

            📚 Bibliothek — hier erstellst du deine eigenen Übungen, zusätzlich zu den bereits verfügbaren.

            🗂️ Routine — fasst eine Liste von Übungen zusammen, die du häufig nutzt (z. B. "Push day"). Einmal erstellt, kannst du sie direkt beim Erstellen eines neuen Workouts auswählen, statt deine Übungen jedes Mal neu einzugeben.

            🏋️ Workout erstellen — hier passiert alles: wähle deine Übungen (oder deine Routine), trage Gewicht/Wiederholungen ein, und los geht's.

            Viel Erfolg beim Training! 🔥
        subject: "Willkommen bei FitTracker 🎉"

