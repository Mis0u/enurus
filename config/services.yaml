# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    League\Flysystem\FilesystemOperator $defaultStorage: '@default.storage'

    App\Service\Contact\RegistrationWelcomeThreadService:
        arguments:
            $adminEmail: '%env(ADMIN_USER_EMAIL)%'

    App\Service\Contact\ContactThreadAdminNotifierService:
        arguments:
            $adminUserEmail: '%env(ADMIN_USER_EMAIL)%'

    App\Service\Security\DeletedAccountReregistrationNotifierService:
        arguments:
            $adminUserEmail: '%env(ADMIN_USER_EMAIL)%'

    App\Service\Security\RegistrationMilestoneNotifierService:
        arguments:
            $adminUserEmail: '%env(ADMIN_USER_EMAIL)%'

    # Service dédié (plutôt que le HttpClientInterface autowiré par défaut) pour pouvoir le
    # remplacer explicitement en test par un MockHttpClient — l'alias autowiré par défaut passe par
    # une chaîne de décoration (debug, uri_template) qui rend `container->set()` inefficace en test.
    deepl.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        public: true

    App\Service\Translation\DeepLTranslationService:
        arguments:
            $httpClient: '@deepl.http_client'
            $deeplApiKey: '%env(DEEPL_API_KEY)%'
            $deeplApiUrl: '%env(DEEPL_API_URL)%'

    App\Service\Translation\BroadcastTranslationFailureNotifierService:
        arguments:
            $adminUserEmail: '%env(ADMIN_USER_EMAIL)%'

    rate_limiter.storage:
        class: Symfony\Component\Cache\Adapter\ArrayAdapter
        autoconfigure: false
        public: false

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
