# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/public/uploads'
            public_url: '/uploads'

# Prod : fichiers uploadés (photos de séance, avatars) sur Cloudflare R2 (API compatible S3)
# plutôt qu'en local — le disque d'un conteneur Scalingo n'est pas persistant entre déploiements,
# tout fichier écrit en local y disparaîtrait au redéploiement suivant.
# R2_ACCESS_KEY / R2_SECRET_KEY / R2_BUCKET_NAME / R2_ENDPOINT / R2_PUBLIC_URL à définir dans les
# variables d'environnement Scalingo (jamais en .env commité). Région fixe 'auto' (R2 n'a pas de
# notion de région comme S3/Scaleway).
when@prod:
    flysystem:
        storages:
            default.storage:
                adapter: 'aws'
                options:
                    client: 'r2.s3_client'
                    bucket: '%env(R2_BUCKET_NAME)%'
                public_url: '%env(R2_PUBLIC_URL)%'

    services:
        r2.s3_client:
            class: Aws\S3\S3Client
            arguments:
                -
                    version: 'latest'
                    region: 'auto'
                    endpoint: '%env(R2_ENDPOINT)%'
                    credentials:
                        key: '%env(R2_ACCESS_KEY)%'
                        secret: '%env(R2_SECRET_KEY)%'
