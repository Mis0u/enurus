# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: App\Security\Session\DoctrineSessionHandler
        # Défaut PHP (1440s / 24 min) trop court pour une séance de musculation — les temps de
        # repos entre séries/exercices dépassent régulièrement ce délai, expirant la session côté
        # serveur (DoctrineSessionHandler) en pleine séance. 4h couvre une séance longue avec repos.
        gc_maxlifetime: 14400
        cookie_lifetime: 14400
        # Valeurs par défaut de Symfony, mais à déclarer : le cookie remember-me ne les hérite que
        # si elles sont écrites ici (RememberMeFactory::prepend), sinon secure: false, samesite: null.
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true

when@prod:
    framework:
        error_controller: App\Controller\ErrorPageController
        # The app container only ever sees requests from Scalingo's own reverse proxy
        # (itself behind Cloudflare) — never directly from the internet — so trusting
        # whoever connects directly (REMOTE_ADDR) and reading its X-Forwarded-* headers
        # is safe and is Symfony's documented pattern for this kind of PaaS setup.
        # Chaîne visiteur → Cloudflare → routeur Scalingo (REMOTE_ADDR) → app. Sans les plages de
        # Cloudflare, getClientIp() s'arrêtait sur l'IP du nœud Cloudflare : les limiteurs par IP
        # (inscription, connexion…) étaient partagés entre tous ses visiteurs.
        # Source : https://www.cloudflare.com/ips/ (relevé le 2026-10-05).
        trusted_proxies: '127.0.0.1,REMOTE_ADDR,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
