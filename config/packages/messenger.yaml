framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # Utilisé via l'en-tête MIME "X-Bus-Transport" sur un email précis (ex. renvoi admin
            # de reset password) pour l'envoyer immédiatement, hors file `async` — cf.
            # ResetPasswordService::resendForAdmin().
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\SendContactBroadcastMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Transport dédié, isolé du DSN Doctrine réel de `async` (celui de SendEmailMessage,
                # jamais fiable à interroger dans un test — cf. docs/CLAUDE.md). N'affecte que
                # SendContactBroadcastMessage, jamais les autres messages routés vers `async`.
                broadcast_test: 'in-memory://'
            routing:
                App\Message\SendContactBroadcastMessage: broadcast_test
