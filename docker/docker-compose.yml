services:
    db:
        image: postgres:17-alpine
        env_file:
            - ./.env
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        command: >
            postgres
            -c idle_in_transaction_session_timeout=300000
            -c statement_timeout=30000
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - db_data_pg17:/var/lib/postgresql/data

    db_test:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: enurus
            POSTGRES_USER: enurus
            POSTGRES_PASSWORD: enurus_test_password
        command: >
            postgres
            -c idle_in_transaction_session_timeout=300000
            -c statement_timeout=30000
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data

volumes:
    # Un volume par version majeure : PostgreSQL refuse de démarrer sur les données d'une autre.
    db_data_pg17:
